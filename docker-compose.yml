# Isolated foundation stack: never reuses the old misko/db-data volume.
name: misko-new-backend

services:
  db:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_USER: misko
      POSTGRES_PASSWORD: misko_local_only
      POSTGRES_DB: misko_foundation
    volumes:
      - foundation-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misko -d misko_foundation"]
      interval: 2s
      timeout: 3s
      retries: 20

  schema:
    build: ./backend
    entrypoint: ["/bootstrap"]
    environment:
      DATABASE_URL: postgres://misko:misko_local_only@db:5432/misko_foundation?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    profiles: [setup]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://misko:misko_local_only@db:5432/misko_foundation?sslmode=disable
      HTTP_ADDR: :4000
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 15s

volumes:
  foundation-db:
