# The database lives on the postgres-data volume. Earlier stacks used
# foundation-db (older schema of this backend) and db-data (the Node.js era,
# PostgreSQL 16); neither is referenced, so both are left untouched rather than
# deleted. Remove them with `docker volume rm` once they are no longer needed.
# Credentials and the signing secret below are for local development only.
name: misko

x-database-url: &database-url postgres://misko:misko_local_only@db:5432/misko_foundation?sslmode=disable

services:
  db:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_USER: misko
      POSTGRES_PASSWORD: misko_local_only
      POSTGRES_DB: misko_foundation
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misko -d misko_foundation"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    entrypoint: ["/bootstrap", "migrate"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    profiles: [setup]

  # Run with `docker compose --profile setup run --rm setup` so the one-time
  # administrator password is printed to your terminal rather than a log.
  setup:
    build: ./backend
    entrypoint: ["/bootstrap", "setup"]
    environment:
      DATABASE_URL: *database-url
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@misko.local}
      LAB_NAME: ${LAB_NAME:-Misko Laboratory}
      LAB_TIMEZONE: ${LAB_TIMEZONE:-UTC}
    depends_on:
      db:
        condition: service_healthy
    profiles: [setup]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: *database-url
      HTTP_ADDR: :4000
      JWT_SECRET: ${JWT_SECRET:-local-development-only-signing-secret}
      # Videos and analysis outputs are kept on the local-videos volume and
      # served by the API under /api/local-storage. Set GCS_BUCKET to use a
      # private Cloud Storage bucket instead; a bucket takes precedence.
      LOCAL_STORAGE_DIR: /data/videos
      GCS_BUCKET: ${GCS_BUCKET:-}
      GCS_SIGNER_EMAIL: ${GCS_SIGNER_EMAIL:-}
    volumes:
      - local-videos:/data/videos
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 15s

  # The web panel. Nginx serves the built single page application and proxies
  # /api to the backend service, so the browser talks to one origin.
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

  # Queues analysis runs for verified, calibrated recordings and requeues
  # expired leases. It needs the database only; workers call the API.
  jobs:
    build: ./backend
    entrypoint: ["/jobs"]
    environment:
      DATABASE_URL: *database-url
      JOB_INTERVAL: ${JOB_INTERVAL:-10s}
    depends_on:
      db:
        condition: service_healthy

  # Analysis worker for every tracked paradigm; start it with --profile worker after registering
  # a worker and setting MISKO_WORKER_TOKEN. It reads sources and writes outputs
  # through signed URLs, from local storage on the API or from GCS.
  worker:
    build: ./worker
    profiles: [worker]
    environment:
      MISKO_API_URL: http://backend:4000
      MISKO_WORKER_TOKEN: ${MISKO_WORKER_TOKEN:-}
    depends_on:
      - backend

volumes:
  postgres-data:
  local-videos:
