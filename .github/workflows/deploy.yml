name: DEPLOY

# Manuel tetiklenen, onay gerektiren dağıtım. "production" environment'ı
# required-reviewer ile korunur; yalnızca onaylı kişi (repo sahibi) deploy'u
# başlatabilir. Push'ta otomatik çalışmaz.
#
# Yaptığı iş: sunucuya (Docker kurulu bir Linux VPS) SSH ile bağlanır, GHCR'deki
# hazır imajları çeker ve docker compose ile (yeniden) başlatır. İmajlar önce
# "Release images" workflow'u ile yayınlanmış olmalı.
#
# Gerekli GitHub secret'ları (Settings > Secrets and variables > Actions):
#   VPS_HOST               Sunucunun IP adresi (veya hostname)
#   VPS_USER               SSH kullanıcı adı (docker grubunda olmalı)
#   VPS_SSH_PRIVATE_KEY    Public anahtarı sunucuda olan SSH private key (tam içerik)
#   APP_POSTGRES_PASSWORD  Postgres şifresi (sabit kalmalı - DB volume'u buna bağlı;
#                          bağlantı URL'sine girdiği için yalnızca harf ve rakam)
#   APP_JWT_SECRET         JWT imzalama anahtarı (sabit, en az 32 bayt rastgele)
#   APP_WORKER_TOKEN       Worker token (opsiyonel; `register-worker` ile alınır,
#                          bkz. docs/DEPLOY.md. Boş kalırsa worker container'ı
#                          tekrar tekrar çıkış yapar, zararsız ama loglarda görünür).
#   SITE_ADDRESS (Variables sekmesi, secret değil)
#                          HTTPS için genel hostname. DNS A kaydı sunucuyu
#                          göstermeli, firewall'da 80 ve 443 açık olmalı. Boşsa
#                          Caddy kurulmaz, TLS'siz :80 kalır.
#
# Videolar sunucunun diskinde, `videos` Docker volume'unda tutulur.
#
# Admin oluşturma (`bootstrap setup`) bilerek burada yok: ürettiği şifre bir CI
# log'una asla yazılmamalı, o yüzden ilk kurulumda hâlâ bir kere elle SSH'lanıp
# çalıştırılması gerekiyor (docs/DEPLOY.md). Worker kaydı da token'ı bir kez
# ekrana bastığı için aynı şekilde elle yapılır, ama worker'ın build/deploy/
# başlatma kısmı bu workflow'a dahil.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR imaj etiketi (örn. latest veya 1.0.0)"
        required: true
        default: latest

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy
    runs-on: ubuntu-latest
    environment: production   # <-- onay kapısı: yalnızca required reviewer başlatabilir
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Boş bir secret'la yazılan .env sunucuda kalıcı olur (aşağıda yalnızca
      # yoksa oluşturuluyor), o yüzden eksik ayar varsa en başta dur.
      - name: Check configuration
        env:
          TAG: ${{ inputs.image_tag }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          APP_POSTGRES_PASSWORD: ${{ secrets.APP_POSTGRES_PASSWORD }}
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
        run: |
          failed=0
          for name in VPS_HOST VPS_USER VPS_SSH_PRIVATE_KEY APP_POSTGRES_PASSWORD APP_JWT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret ${name} is not set"
              failed=1
            fi
          done
          if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]*$ ]]; then
            echo "::error::image_tag is not a valid image tag"
            failed=1
          fi
          exit "$failed"

      - name: Prepare SSH
        env:
          KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Render .env
        env:
          TAG: ${{ inputs.image_tag }}
          PG: ${{ secrets.APP_POSTGRES_PASSWORD }}
          JWT: ${{ secrets.APP_JWT_SECRET }}
        run: |
          {
            echo "IMAGE_OWNER=happyhackingspace"
            echo "IMAGE_TAG=${TAG}"
            echo "POSTGRES_USER=misko"
            echo "POSTGRES_PASSWORD=${PG}"
            echo "POSTGRES_DB=misko"
            echo "JWT_SECRET=${JWT}"
            echo "TOKEN_TTL=12h"
            echo "ADMIN_EMAIL=admin@miskolab.com"
            echo "LAB_NAME=Yüzüncü Yıl Üniversitesi"
            echo "LAB_TIMEZONE=Europe/Istanbul"
            echo "JOB_INTERVAL=10s"
            echo "FRONTEND_PORT=80"
          } > .env.deploy

      - name: Render worker.env
        # Ayrı dosya, .env'in aksine her deploy'da üzerine yazılır: worker
        # token'ı DB şifresi gibi kalıcı bir sır değil, güvenle yenilenebilir.
        env:
          TOKEN: ${{ secrets.APP_WORKER_TOKEN }}
        run: echo "MISKO_WORKER_TOKEN=${TOKEN}" > worker.env

      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          TAG: ${{ inputs.image_tag }}
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new"
          SCP="scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new"
          $SSH "$USER@$HOST" 'mkdir -p ~/misko'
          $SCP docker-compose.prod.yml "$USER@$HOST:~/misko/docker-compose.prod.yml"
          # Worker'ın kaynak kodu: image henüz publish edilmiyor, sunucu orada
          # build ediyor. Önce eski kopya silinir; yoksa `scp -r` yeni kodu
          # worker/worker altına koyar ve güncellemeler build'e hiç girmez.
          $SSH "$USER@$HOST" 'rm -rf ~/misko/worker'
          $SCP -r worker "$USER@$HOST:~/misko/worker"
          # .env'i yalnızca yoksa oluştur: mevcut DB şifresi/secret'lar korunur,
          # böylece her deploy'da DB sıfırlanmaz / auth bozulmaz. Tek istisna
          # IMAGE_TAG: her deploy'da seçilen etikete güncellenir, sunucuda elle
          # çalıştırılan compose komutları da aynı sürümü kullanır.
          $SCP .env.deploy "$USER@$HOST:~/misko/.env.new"
          $SSH "$USER@$HOST" "cd ~/misko && if [ -f .env ]; then rm -f .env.new; else mv .env.new .env; fi && sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=$TAG/' .env && chmod 600 .env"
          # worker.env her deploy'da yeniden yazılır (bkz. yukarıdaki adım),
          # .env'in aksine korunmuyor.
          $SCP worker.env "$USER@$HOST:~/misko/worker.env"
          $SSH "$USER@$HOST" 'chmod 600 ~/misko/worker.env'
          # Güncel imajı çek, worker'ı kaynaktan yeniden build et, değişen
          # container'ları yenile, eski/dangling imajları temizle.
          # Migration: boş veritabanını kurar, mevcut olanda bekleyen
          # migration'ları tek transaction'da uygular (bkz. backend/schema).
          # Yeni imajla ve `up`'tan önce çalışır; başarısız olursa DB değişmez
          # ve deploy burada durur, eski container'lar çalışmaya devam eder.
          # Bu yüzden `|| true` yok.
          #
          # HTTPS: SITE_ADDRESS (repo variable) doluysa Caddy `https` profile'iyle
          # açılır ve Let's Encrypt sertifikası alır. Caddy 80/443'ü tuttuğu için
          # frontend'in yayını 127.0.0.1:8080'e çekilir; .env'deki
          # FRONTEND_PORT=80 değeri bu komut satırı değişkenleriyle ezilir.
          # Boşsa frontend doğrudan :80'de, TLS yok.
          if [ -n "$SITE_ADDRESS" ]; then
            $SCP Caddyfile "$USER@$HOST:~/misko/Caddyfile"
            RUN_ENV="SITE_ADDRESS='$SITE_ADDRESS' FRONTEND_BIND=127.0.0.1 FRONTEND_PORT=8080"
            PROFILES="--profile https --profile worker"
          else
            RUN_ENV=""
            PROFILES="--profile worker"
          fi
          $SSH "$USER@$HOST" "cd ~/misko && $RUN_ENV docker compose -f docker-compose.prod.yml $PROFILES pull --ignore-buildable && $RUN_ENV docker compose -f docker-compose.prod.yml --profile setup run --rm migrate && $RUN_ENV docker compose -f docker-compose.prod.yml $PROFILES up -d --build && docker image prune -f"

      - name: Summary
        env:
          TAG: ${{ inputs.image_tag }}
          HOST: ${{ secrets.VPS_HOST }}
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
        run: |
          if [ -n "$SITE_ADDRESS" ]; then
            echo "Deployed image_tag=${TAG} to ${HOST} (https://${SITE_ADDRESS})"
          else
            echo "Deployed image_tag=${TAG} to ${HOST} (frontend on :80)"
          fi
