name: Deploy to GCP VM

# Manuel tetiklenen, onay gerektiren dağıtım. "production" environment'ı
# required-reviewer ile korunur; yalnızca onaylı kişi (repo sahibi) deploy'u
# başlatabilir. Push'ta otomatik çalışmaz.
#
# Yaptığı iş: GCP VM'ine SSH ile bağlanır, GHCR'deki hazır imajları çeker ve
# docker compose ile (yeniden) başlatır. İmajlar önce "Release images" workflow'u
# ile yayınlanmış olmalı.
#
# Gerekli GitHub secret'ları (Settings > Secrets and variables > Actions):
#   GCP_VM_HOST          VM dış IP (veya hostname)
#   GCP_VM_USER          SSH kullanıcı adı
#   GCP_SSH_PRIVATE_KEY  Public anahtarı VM'de olan SSH private key (tam içerik)
#   APP_POSTGRES_PASSWORD  Postgres şifresi (sabit kalmalı - DB volume'u buna bağlı)
#   APP_JWT_SECRET         JWT imzalama anahtarı (sabit, güçlü rastgele)
#   APP_WORKER_TOKEN       Worker token (opsiyonel; worker'ı POST /api/analysis/workers
#                          ile kaydedince alınır - kayıt hâlâ elle yapılır, admin girişi
#                          gerektiriyor. Boş kalırsa worker container'ı tekrar tekrar
#                          çıkış yapar, zararsız ama loglarda görünür).
#   APP_GCS_BUCKET         Private GCS bucket adı (opsiyonel; boşsa video route'ları 503 döner).
#   SITE_ADDRESS (Variables sekmesi, secret değil)
#                          HTTPS için genel hostname, örn. misko.happyhackings.space.
#                          DNS A kaydı VM'i göstermeli, GCP firewall'da 80 ve 443
#                          açık olmalı. Boşsa Caddy kurulmaz, TLS'siz :80 kalır.
#   APP_GCS_SIGNER_EMAIL   İmzalayan servis hesabı e-postası (VM'nin kendi servis hesabı
#                          olabilir; bucket üzerinde Storage Object Admin ve kendi
#                          üzerinde Service Account Token Creator rolü gerekir).
#
# Admin oluşturma (`bootstrap setup`) bilerek burada yok: ürettiği şifre bir CI
# log'una asla yazılmamalı, o yüzden ilk kurulumda hâlâ bir kere elle SSH'lanıp
# çalıştırılması gerekiyor (docs/DEPLOY.md). Worker'ın kaydı da bir admin oturumu
# gerektirdiği için aynı şekilde elle yapılır, ama worker'ın build/deploy/başlatma
# kısmı bu workflow'a dahil edildi.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR imaj etiketi (örn. latest veya 1.0.0)"
        required: true
        default: latest

concurrency:
  group: deploy-gcp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy
    runs-on: ubuntu-latest
    environment: production   # <-- onay kapısı: yalnızca required reviewer başlatabilir
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare SSH
        env:
          KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.GCP_VM_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Render .env
        env:
          TAG: ${{ inputs.image_tag }}
          PG: ${{ secrets.APP_POSTGRES_PASSWORD }}
          JWT: ${{ secrets.APP_JWT_SECRET }}
        run: |
          {
            echo "IMAGE_OWNER=happyhackingspace"
            echo "IMAGE_TAG=${TAG}"
            echo "POSTGRES_USER=misko"
            echo "POSTGRES_PASSWORD=${PG}"
            echo "POSTGRES_DB=misko"
            echo "JWT_SECRET=${JWT}"
            echo "TOKEN_TTL=12h"
            echo "ADMIN_EMAIL=admin@miskolab.com"
            echo "LAB_NAME=Yüzüncü Yıl Üniversitesi"
            echo "LAB_TIMEZONE=Europe/Istanbul"
            echo "JOB_INTERVAL=10s"
            echo "FRONTEND_PORT=80"
          } > .env.deploy

      - name: Render worker.env
        # Ayrı dosya, .env'in aksine her deploy'da üzerine yazılır: worker
        # token'ı DB şifresi gibi kalıcı bir sır değil, güvenle yenilenebilir.
        env:
          TOKEN: ${{ secrets.APP_WORKER_TOKEN }}
        run: echo "MISKO_WORKER_TOKEN=${TOKEN}" > worker.env

      - name: Render storage.env
        # Aynı mantık: GCS ayarları .env'in aksine her deploy'da tazelenir.
        env:
          BUCKET: ${{ secrets.APP_GCS_BUCKET }}
          SIGNER: ${{ secrets.APP_GCS_SIGNER_EMAIL }}
        run: |
          {
            echo "GCS_BUCKET=${BUCKET}"
            echo "GCS_SIGNER_EMAIL=${SIGNER}"
          } > storage.env

      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.GCP_VM_HOST }}
          USER: ${{ secrets.GCP_VM_USER }}
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new"
          SCP="scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new"
          $SSH "$USER@$HOST" 'mkdir -p ~/misko'
          $SCP docker-compose.prod.yml "$USER@$HOST:~/misko/docker-compose.prod.yml"
          # Worker'ın kaynak kodu: image henüz publish edilmiyor, VM orada build
          # ediyor, o yüzden klasörün kendisi orada durmalı.
          $SCP -r worker "$USER@$HOST:~/misko/worker"
          # .env'i yalnızca yoksa oluştur: mevcut DB şifresi/secret'lar korunur,
          # böylece her deploy'da DB sıfırlanmaz / auth bozulmaz.
          $SCP .env.deploy "$USER@$HOST:~/misko/.env.new"
          $SSH "$USER@$HOST" 'cd ~/misko && if [ -f .env ]; then rm -f .env.new; else mv .env.new .env; fi'
          # worker.env ve storage.env her deploy'da yeniden yazılır (bkz.
          # yukarıdaki adımlar), .env'in aksine korunmuyor.
          $SCP worker.env "$USER@$HOST:~/misko/worker.env"
          $SCP storage.env "$USER@$HOST:~/misko/storage.env"
          # Güncel imajı çek, worker'ı kaynaktan yeniden build et, değişen
          # container'ları yenile, eski/dangling imajları temizle.
          # Şemayı kur: sadece boş bir veritabanında işe yarar. `backend/schema`
          # bilerek IF NOT EXISTS kullanmıyor (bkz. 001_initial.sql), yani ilk
          # kurulumdan sonraki her deploy'da bu adım *hata verir* - veri
          # kaybetmez (transaction rollback), sadece "zaten kurulu" der. O
          # yüzden `|| true`: zinciri kırmasın, ilk deploy'da hâlâ gerçek işi
          # yapar. Yönetici oluşturma (`setup`) ve worker kaydı
          # (`POST /api/analysis/workers`) buraya dahil değil; ikisi de bir
          # admin oturumu/şifresi gerektiriyor ve bir CI log'una asla
          # yazılmamalı, bu yüzden hâlâ elle yapılıyor (bkz. docs/DEPLOY.md).
          # Worker container'ı gerçek bir token gelene kadar tekrar tekrar çıkış
          # yapar; zararsız, sadece loglarda görünür.
          #
          # HTTPS: SITE_ADDRESS (repo variable) doluysa Caddy `https` profile'iyle
          # açılır ve Let's Encrypt sertifikası alır. Caddy 80/443'ü tuttuğu için
          # frontend'in yayını 127.0.0.1:8080'e çekilir; .env'deki eski
          # FRONTEND_PORT=80 değeri bu komut satırı değişkenleriyle ezilir.
          # Boşsa eski davranış: frontend doğrudan :80'de, TLS yok.
          if [ -n "$SITE_ADDRESS" ]; then
            $SCP Caddyfile "$USER@$HOST:~/misko/Caddyfile"
            RUN_ENV="SITE_ADDRESS='$SITE_ADDRESS' FRONTEND_BIND=127.0.0.1 FRONTEND_PORT=8080"
            PROFILES="--profile https --profile worker"
          else
            RUN_ENV=""
            PROFILES="--profile worker"
          fi
          $SSH "$USER@$HOST" "cd ~/misko && $RUN_ENV docker compose -f docker-compose.prod.yml $PROFILES pull --ignore-buildable && ($RUN_ENV docker compose -f docker-compose.prod.yml --profile setup run --rm schema || true) && $RUN_ENV docker compose -f docker-compose.prod.yml $PROFILES up -d --build && docker image prune -f"

      - name: Summary
        env:
          TAG: ${{ inputs.image_tag }}
          HOST: ${{ secrets.GCP_VM_HOST }}
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
        run: |
          if [ -n "$SITE_ADDRESS" ]; then
            echo "Deployed image_tag=${TAG} to ${HOST} (https://${SITE_ADDRESS})"
          else
            echo "Deployed image_tag=${TAG} to ${HOST} (frontend on :80)"
          fi
