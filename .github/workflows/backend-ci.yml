name: Backend CI

on:
  push:
    branches: [new-backend]
    paths: ['backend/**', '.github/workflows/backend-ci.yml', 'docker-compose.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml', 'docker-compose.yml']

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: misko
          POSTGRES_PASSWORD: misko_ci_only
          POSTGRES_DB: misko_foundation_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U misko -d misko_foundation_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://misko:misko_ci_only@localhost:5432/misko_foundation_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: make check
      - run: make integration
      - run: make build
      - name: Build container without publishing
        run: docker build -t misko-foundation:ci .
