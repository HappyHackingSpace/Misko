name: Bug report
description: Something in Mişko does not work as described
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security problems here. Use the private process in
        [SECURITY.md](https://github.com/HappyHackingSpace/Misko/blob/main/SECURITY.md).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend (API)
        - Frontend (panel)
        - Worker (video analysis)
        - Deployment / Docker
        - Documentation
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as ...
        2. Open ...
        3. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Output of `git rev-parse --short HEAD`, or the image tag.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, signed URLs and personal data first.
      render: shell
