# TLS ends at a proxy in front of this container (Caddy, see the `https` profile
# in docker-compose.prod.yml), so $scheme is always http here. Trust the
# proxy's X-Forwarded-Proto when present; without a proxy it falls back to $scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API isteklerini backend servisine yönlendir (docker-compose ağı)
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # SPA fallback — tüm rotalar index.html'e düşer
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statik varlıklar için önbellek
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
