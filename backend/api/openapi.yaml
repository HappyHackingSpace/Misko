                        paradigmKey: {type: string}
                        paradigmVersion: {type: integer}
                        metrics: {type: array, items: {type: string}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/experiments/{id}/groups:
