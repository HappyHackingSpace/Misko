  /api/experiments/{id}/tests:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: listTests
      summary: Tests of this experiment, earliest scheduled first (*:read)
      parameters:
        - {name: timepointId, in: query, schema: {type: string, format: uuid}}
        - {name: subjectId, in: query, schema: {type: string, format: uuid}, description: Tests that include this animal}
        - {name: status, in: query, schema: {type: string}, description: 'One status or several separated by commas'}
        - {name: order, in: query, schema: {type: string, enum: [asc, desc]}, description: By scheduled time; earliest first by default}
        - {name: paradigmKey, in: query, schema: {$ref: '#/components/schemas/ConstantKey'}}
        - {name: search, in: query, schema: {type: string, maxLength: 100}, description: Case-insensitive match on the study code, timepoint name or a subject code}
        - {name: from, in: query, schema: {type: string, format: date}, description: Inclusive first scheduled date in the laboratory's time zone}
        - {name: to, in: query, schema: {type: string, format: date}, description: Inclusive last scheduled date in the laboratory's time zone}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Tests with their animals
          content:
            application/json:
              schema: {type: object, required: [data, total, page, pageSize], properties: {data: {type: array, items: {$ref: '#/components/schemas/Test'}}, total: {type: integer}, page: {type: integer}, pageSize: {type: integer}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createTest
      summary: Plan a session of a running experiment with its animals (test:write)
      description: >-
        The paradigm and planned trials come from the protocol step. Every arena must be an environment revision of the step's
        paradigm version, every animal an allocation of this experiment that is not excluded, and no animal may already be in
        another non-cancelled test of the same timepoint and protocol step (409 test.animalAlreadyScheduled).
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TestInput'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Test'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/tests:
    get:
      operationId: listAllTests
      summary: Worklist of tests across every experiment, newest scheduled first unless order=asc (*:read)
      parameters:
        - {name: experimentId, in: query, schema: {type: string, format: uuid}}
        - {name: timepointId, in: query, schema: {type: string, format: uuid}}
        - {name: subjectId, in: query, schema: {type: string, format: uuid}, description: Tests that include this animal}
        - {name: status, in: query, schema: {type: string}, description: 'One status or several separated by commas, for example PLANNED,IN_PROGRESS'}
        - {name: order, in: query, schema: {type: string, enum: [asc, desc]}, description: By scheduled time}
        - {name: paradigmKey, in: query, schema: {$ref: '#/components/schemas/ConstantKey'}}
        - {name: search, in: query, schema: {type: string, maxLength: 100}, description: Case-insensitive match on the study code, timepoint name or a subject code}
        - {name: from, in: query, schema: {type: string, format: date}, description: Inclusive first scheduled date in the laboratory's time zone}
        - {name: to, in: query, schema: {type: string, format: date}, description: Inclusive last scheduled date in the laboratory's time zone}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Tests with their animals
          content:
            application/json:
              schema: {type: object, required: [data, total, page, pageSize], properties: {data: {type: array, items: {$ref: '#/components/schemas/Test'}}, total: {type: integer}, page: {type: integer}, pageSize: {type: integer}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
