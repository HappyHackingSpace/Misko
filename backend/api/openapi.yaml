      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TrialInput'}}}}
      responses:
        '201': {description: Recorded, content: {application/json: {schema: {$ref: '#/components/schemas/Trial'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/tests/{id}/comments:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: listTestComments
      summary: Comments on a test, oldest first (any signed-in user)
      responses:
        '200':
          description: Comments
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/Comment'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createTestComment
      summary: Comment on a test (any signed-in user, at most 20 comment changes per minute)
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CommentInput'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Comment'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/tests/{id}/comments/{commentId}:
    parameters:
      - $ref: '#/components/parameters/ID'
      - {name: commentId, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: updateTestComment
      summary: Edit your own comment (author only; counts toward the comment limit)
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CommentInput'}}}}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Comment'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteTestComment
      summary: Delete a comment (its author, SUPERADMIN or LAB_MANAGER)
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
components:
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    PageSize: {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 10}, description: Values above 100 are capped}
    SubstanceFilter: {name: substanceId, in: query, schema: {type: string, format: uuid}}
    ExperimentFilter: {name: experimentId, in: query, schema: {type: string, format: uuid}}
    From: {name: from, in: query, schema: {type: string, format: date-time}, description: Inclusive lower bound on administeredAt}
    To: {name: to, in: query, schema: {type: string, format: date-time}, description: Exclusive upper bound on administeredAt}
    ParadigmKey: {name: key, in: path, required: true, schema: {type: string, pattern: '^[A-Z_]+$'}, example: OPEN_FIELD}
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 token with issuer, audience and expiry; see backend/README.md
  responses:
    Problem:
      description: Error with a stable code
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Session:
      description: Bearer token and the signed-in user
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [token, tokenType, expiresAt, user]
            properties:
              token: {type: string}
              tokenType: {type: string, enum: [Bearer]}
              expiresAt: {type: string, format: date-time}
              user:
                $ref: '#/components/schemas/User'
    User:
      description: User
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/User'
    Laboratory:
      description: Laboratory
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [name, code, timezone, createdAt, updatedAt]
            properties:
              name: {type: string}
              code: {type: [string, 'null']}
              timezone: {type: string}
              createdAt: {type: string, format: date-time}
              updatedAt: {type: string, format: date-time}
  schemas:
    Species: {type: string, enum: [MOUSE, RAT]}
    Sex: {type: string, enum: [FEMALE, MALE, UNKNOWN]}
    GroupRole: {type: string, enum: [CONTROL, TREATMENT]}
    Code:
      type: string
      pattern: '^[A-Za-z0-9._/-]{1,64}$'
      description: Unique ignoring case
    Subject:
      type: object
      required: [id, code, species, sex, strain, birthDate, notes, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        code: {$ref: '#/components/schemas/Code'}
        species: {$ref: '#/components/schemas/Species'}
        sex: {$ref: '#/components/schemas/Sex'}
        strain: {type: [string, 'null'], maxLength: 120}
        birthDate: {type: [string, 'null'], format: date}
        notes: {type: [string, 'null'], maxLength: 2000}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    SubjectInput:
      type: object
      additionalProperties: false
      required: [code, species, sex]
      properties:
        code: {$ref: '#/components/schemas/Code'}
        species: {$ref: '#/components/schemas/Species'}
        sex: {$ref: '#/components/schemas/Sex'}
        strain: {type: string, maxLength: 120}
        birthDate: {type: string, format: date, description: Not later than one day after the current UTC date}
        notes: {type: string, maxLength: 2000}
    SubjectPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Omitted fields are unchanged; an empty strain, birthDate or notes clears it
      properties:
        code: {$ref: '#/components/schemas/Code'}
        species: {$ref: '#/components/schemas/Species'}
        sex: {$ref: '#/components/schemas/Sex'}
        strain: {type: string, maxLength: 120}
        birthDate: {type: string, description: YYYY-MM-DD or empty}
        notes: {type: string, maxLength: 2000}
    Experiment:
      type: object
      required: [id, code, title, description, requiresControl, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        code: {$ref: '#/components/schemas/Code'}
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: [string, 'null'], maxLength: 5000}
        requiresControl: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ExperimentDetail:
      allOf:
        - $ref: '#/components/schemas/Experiment'
        - type: object
          required: [controlRequirementMet]
          properties:
            controlRequirementMet: {type: boolean, description: True unless a control group is required and none exists}
    ExperimentInput:
      type: object
      additionalProperties: false
      required: [code, title]
      properties:
        code: {$ref: '#/components/schemas/Code'}
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 5000}
        requiresControl: {type: boolean, default: false}
    ExperimentPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Omitted fields are unchanged; an empty description clears it
      properties:
        code: {$ref: '#/components/schemas/Code'}
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 5000}
        requiresControl: {type: boolean}
    Phase:
      type: object
      required: [id, experimentId, name, position, description, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        experimentId: {type: string, format: uuid}
        name: {type: string, description: Unique within the experiment ignoring case}
        position: {type: integer, minimum: 1, maximum: 1000, description: Unique within the experiment}
        description: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    PhaseInput:
      type: object
      additionalProperties: false
      required: [name, position]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        position: {type: integer, minimum: 1, maximum: 1000}
        description: {type: string, maxLength: 5000}
    PhasePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        position: {type: integer, minimum: 1, maximum: 1000}
        description: {type: string, maxLength: 5000}
    Group:
      type: object
      required: [id, experimentId, name, role, targetSize, description, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        experimentId: {type: string, format: uuid}
        name: {type: string, description: Unique within the experiment ignoring case}
        role: {$ref: '#/components/schemas/GroupRole'}
        targetSize: {type: [integer, 'null'], minimum: 1}
        description: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    GroupSize:
      allOf:
        - $ref: '#/components/schemas/Group'
        - type: object
          required: [activeSubjects]
          properties:
            activeSubjects: {type: integer, description: Assignments active at the database clock}
    GroupInput:
      type: object
      additionalProperties: false
      required: [name, role]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        role: {$ref: '#/components/schemas/GroupRole'}
        targetSize: {type: integer, minimum: 0, maximum: 100000, description: 0 means no target}
        description: {type: string, maxLength: 5000}
    GroupPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Omitted fields are unchanged; targetSize 0 removes the target
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        role: {$ref: '#/components/schemas/GroupRole'}
        targetSize: {type: integer, minimum: 0, maximum: 100000}
        description: {type: string, maxLength: 5000}
    Enrollment:
      type: object
      required: [id, experimentId, subjectId, enrolledAt, currentGroupId, createdAt]
      properties:
        id: {type: string, format: uuid}
        experimentId: {type: string, format: uuid}
        subjectId: {type: string, format: uuid}
        enrolledAt: {type: string, format: date-time}
        currentGroupId: {type: [string, 'null'], format: uuid, description: Group assigned now}
        createdAt: {type: string, format: date-time}
    EnrollmentDetail:
      allOf:
        - $ref: '#/components/schemas/Enrollment'
        - type: object
          required: [assignments]
          properties:
            assignments: {type: array, items: {$ref: '#/components/schemas/Assignment'}, description: Oldest first}
    EnrollmentInput:
      type: object
      additionalProperties: false
      required: [subjectId, enrolledAt]
      properties:
        subjectId: {type: string, format: uuid}
        enrolledAt: {type: string, format: date-time}
        groupId: {type: string, format: uuid, description: Initial group starting at enrolledAt}
    Assignment:
      type: object
      required: [id, groupId, validFrom, validTo, createdAt]
      properties:
        id: {type: string, format: uuid}
        groupId: {type: string, format: uuid}
        validFrom: {type: string, format: date-time}
        validTo: {type: [string, 'null'], format: date-time, description: Exclusive end; null while open}
        createdAt: {type: string, format: date-time}
    AssignmentInput:
      type: object
      additionalProperties: false
      required: [groupId, effectiveFrom]
      properties:
        groupId: {type: string, format: uuid}
        effectiveFrom: {type: string, format: date-time}
    CatalogEntry:
      type: object
      required: [id, name, description, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, description: Unique ignoring case}
        description: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CatalogList:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/CatalogEntry'}}
    CatalogInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 5000}
    CatalogPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 5000, description: Empty clears it}
    Amount:
      type: string
      pattern: '^[0-9]{1,9}(\.[0-9]{1,6})?$'
      description: Positive decimal, stored exactly
    DoseUnit:
      type: string
      enum: [mg, ug, g, mL, uL, IU, mg/kg, ug/kg, IU/kg]
    AdministrationRoute:
      type: string
      enum: [ORAL, INTRAPERITONEAL, SUBCUTANEOUS, INTRAVENOUS, INTRAMUSCULAR, INTRANASAL, INTRACEREBROVENTRICULAR, TOPICAL, INHALATION]
    Dose:
      type: object
      required: [amount, unit]
      properties:
        amount: {$ref: '#/components/schemas/Amount'}
        unit: {$ref: '#/components/schemas/DoseUnit'}
    InterventionPlan:
      type: object
      required: [id, experimentId, groupId, phaseId, substanceId, dose, route, schedule, notes, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        experimentId: {type: string, format: uuid}
        groupId: {type: string, format: uuid}
        phaseId: {type: [string, 'null'], format: uuid}
        substanceId: {type: string, format: uuid}
        dose: {$ref: '#/components/schemas/Dose'}
        route: {$ref: '#/components/schemas/AdministrationRoute'}
        schedule: {type: string}
        notes: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    InterventionPlanInput:
      type: object
      additionalProperties: false
      required: [groupId, substanceId, amount, unit, route, schedule]
      properties:
        groupId: {type: string, format: uuid}
        phaseId: {type: string, format: uuid}
        substanceId: {type: string, format: uuid}
        amount: {$ref: '#/components/schemas/Amount'}
        unit: {$ref: '#/components/schemas/DoseUnit'}
        route: {$ref: '#/components/schemas/AdministrationRoute'}
        schedule: {type: string, minLength: 1, maxLength: 500}
        notes: {type: string, maxLength: 2000}
    InterventionPlanPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: amount and unit must be sent together
      properties:
        amount: {$ref: '#/components/schemas/Amount'}
        unit: {$ref: '#/components/schemas/DoseUnit'}
        route: {$ref: '#/components/schemas/AdministrationRoute'}
        schedule: {type: string, minLength: 1, maxLength: 500}
        notes: {type: string, maxLength: 2000}
    WeightMeasurement:
      type: object
      required: [id, subjectId, grams, measuredAt, recordedBy, createdAt]
      properties:
        id: {type: string, format: uuid}
        subjectId: {type: string, format: uuid}
        grams: {type: string, description: Up to 3 decimals}
        measuredAt: {type: string, format: date-time}
        recordedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
    WeightInput:
      type: object
      additionalProperties: false
      required: [grams, measuredAt]
      properties:
        grams: {type: string, pattern: '^[0-9]{1,4}(\.[0-9]{1,3})?$', description: Between 0.001 and 5000}
        measuredAt: {type: string, format: date-time, description: Not in the future}
    ConditionStatus:
      type: string
      enum: [INDUCED, CONFIRMED, NOT_CONFIRMED, RESOLVED]
    SubjectCondition:
      type: object
      required: [id, subjectId, diseaseModelId, diseaseModelName, enrollmentId, status, observedAt, notes, recordedBy, createdAt]
      properties:
        id: {type: string, format: uuid}
        subjectId: {type: string, format: uuid}
        diseaseModelId: {type: string, format: uuid}
        diseaseModelName: {type: string, description: Name when the observation was recorded}
        enrollmentId: {type: [string, 'null'], format: uuid}
        status: {$ref: '#/components/schemas/ConditionStatus'}
        observedAt: {type: string, format: date-time}
        notes: {type: [string, 'null']}
        recordedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
    SubjectConditionInput:
      type: object
      additionalProperties: false
      required: [diseaseModelId, status, observedAt]
      properties:
        diseaseModelId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/ConditionStatus'}
        observedAt: {type: string, format: date-time, description: Not in the future}
        enrollmentId: {type: string, format: uuid, description: Must belong to the same subject}
        notes: {type: string, maxLength: 2000}
    Administration:
      type: object
      required: [id, experimentId, enrollmentId, subjectId, substanceId, substanceName, planId, weightMeasurementId, bodyWeightGrams, dose, absoluteDose, route, administeredAt, notes, recordedBy, createdAt]
      properties:
        id: {type: string, format: uuid}
        experimentId: {type: string, format: uuid}
        enrollmentId: {type: string, format: uuid}
        subjectId: {type: string, format: uuid}
        substanceId: {type: string, format: uuid}
        substanceName: {type: string, description: Name when the administration was recorded}
        planId: {type: [string, 'null'], format: uuid}
        weightMeasurementId: {type: [string, 'null'], format: uuid}
        bodyWeightGrams: {type: [string, 'null'], description: Weight used for a per-kilogram dose}
        dose: {$ref: '#/components/schemas/Dose'}
        absoluteDose:
          description: Dose multiplied by body mass for per-kilogram units, rounded half up to 6 decimals; equal to dose otherwise
          oneOf:
            - $ref: '#/components/schemas/Dose'
            - type: 'null'
        route: {$ref: '#/components/schemas/AdministrationRoute'}
        administeredAt: {type: string, format: date-time}
        notes: {type: [string, 'null']}
        recordedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
    AdministrationInput:
      type: object
      additionalProperties: false
      required: [substanceId, amount, unit, route, administeredAt]
      properties:
        substanceId: {type: string, format: uuid}
        planId: {type: string, format: uuid, description: Same experiment and substance; the subject must be in the plan's group at administeredAt}
        weightMeasurementId: {type: string, format: uuid, description: Required for per-kilogram units; same subject, measured within the 7 days before}
        amount: {$ref: '#/components/schemas/Amount'}
        unit: {$ref: '#/components/schemas/DoseUnit'}
        route: {$ref: '#/components/schemas/AdministrationRoute'}
        administeredAt: {type: string, format: date-time, description: Not before enrollment and not in the future}
        notes: {type: string, maxLength: 2000}
    AdministrationPage:
      type: object
      required: [data, total, page, pageSize]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Administration'}}
        total: {type: integer}
        page: {type: integer}
        pageSize: {type: integer}
    ParadigmSummary:
      type: object
      required: [key, name, category, species, versions, latestVersion, automatedAnalysis]
      properties:
        key: {type: string}
        name: {type: string}
        category: {type: string, enum: [LEARNING_MEMORY, ANXIETY, MOTOR, SOCIAL]}
        species: {type: array, items: {type: string}}
        versions: {type: array, items: {type: integer}}
        latestVersion: {type: integer}
        automatedAnalysis: {type: boolean, description: Whether a real analysis worker supports this paradigm; catalog presence alone does not}
    ParadigmParameter:
      type: object
      required: [key, label, unit, valueType, min, max, default]
      properties:
        key: {type: string}
        label: {type: string}
        unit: {type: string, enum: [cm, cm_s, s, count, ratio, rpm, boolean]}
        valueType: {type: string, enum: [number, integer], description: Integer parameters accept whole numbers only; booleans are 0 or 1}
        min: {type: number}
        max: {type: number}
        default: {type: number}
    ParadigmMetric:
      type: object
      required: [key, label, unit, valueType, definition, formula, missingWhen, inputs, min, max, tolerance]
      properties:
        key: {type: string}
        label: {type: string}
        unit: {type: string, enum: [cm, cm_s, s, count, ratio, rpm, boolean]}
        valueType: {type: string, enum: [number, integer]}
        definition: {type: string}
        formula: {type: string}
        missingWhen: {type: string, description: When the metric is reported missing instead of a value}
        inputs: {type: array, items: {type: string}}
        min: {type: number}
        max: {type: number}
        tolerance: {type: number, description: Absolute tolerance in the metric unit}
    ParadigmEvent:
      type: object
      required: [type, kind, labels, single, definition]
      properties:
        type: {type: string}
        kind: {type: string, enum: [INTERVAL, POINT]}
        labels: {type: array, items: {type: string}, description: Allowed labels; empty when the event takes no label}
        single: {type: boolean, description: The event may occur at most once per trial}
        definition: {type: string}
    ParadigmManifest:
      type: object
      required: [key, name, category, species, trialTypes, version, metricEngineVersion, resultSchemaVersion, automatedAnalysis, apparatusParameters, sessionParameters, zones, inputEvents, events, metrics, qc]
      properties:
        key: {type: string}
        name: {type: string}
        category: {type: string}
        species: {type: array, items: {type: string}}
        trialTypes: {type: array, items: {type: string}}
        version: {type: integer, description: ParadigmVersion; a published version never changes}
        metricEngineVersion: {type: integer}
        resultSchemaVersion: {type: integer}
        automatedAnalysis: {type: boolean}
        apparatusParameters: {type: array, items: {$ref: '#/components/schemas/ParadigmParameter'}}
        sessionParameters: {type: array, items: {$ref: '#/components/schemas/ParadigmParameter'}}
        zones:
          type: array
          items:
            type: object
            required: [key, role, geometry, calibrated, required]
            properties:
              key: {type: string}
              role: {type: string}
              geometry: {type: string}
              calibrated: {type: boolean, description: Shapes come with the analysis input (per-video calibration) instead of being derived from parameters}
              required: {type: boolean}
        inputEvents:
          type: array
          description: Scored observations the metric engine consumes
          items: {$ref: '#/components/schemas/ParadigmEvent'}
        events:
          type: array
          description: Intervals and points the metric engine derives
          items: {$ref: '#/components/schemas/ParadigmEvent'}
        metrics: {type: array, items: {$ref: '#/components/schemas/ParadigmMetric'}}
        qc:
          type: array
          items: {type: object, required: [key, operator, value, unit], properties: {key: {type: string}, operator: {type: string}, value: {type: number}, unit: {type: string}}}
    ParameterValues:
      type: object
      additionalProperties: {type: number}
      description: Parameter values by key, in the units of the paradigm manifest
    ConstantKey: {type: string, pattern: '^[A-Z][A-Z_]{0,39}$'}
    Environment:
      type: object
      required: [id, name, paradigmKey, notes, latestRevision, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        paradigmKey: {$ref: '#/components/schemas/ConstantKey'}
        notes: {type: [string, 'null']}
        latestRevision: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    EnvironmentRevision:
      type: object
      required: [id, environmentId, number, paradigmKey, paradigmVersion, apparatus, notes, createdBy, createdAt]
      description: Immutable measurements validated against one paradigm version
      properties:
        id: {type: string, format: uuid}
        environmentId: {type: string, format: uuid}
        number: {type: integer, minimum: 1}
        paradigmKey: {$ref: '#/components/schemas/ConstantKey'}
        paradigmVersion: {type: integer, minimum: 1}
        apparatus: {$ref: '#/components/schemas/ParameterValues'}
        notes: {type: [string, 'null']}
        createdBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
    EnvironmentRevisionInput:
      type: object
      additionalProperties: false
      required: [paradigmVersion, apparatus]
      properties:
        paradigmVersion: {type: integer, minimum: 1}
        apparatus:
          allOf: [{$ref: '#/components/schemas/ParameterValues'}]
          description: Every apparatus parameter of the paradigm version, within range and consistent; no measurement is defaulted
        notes: {type: string, maxLength: 2000}
    EnvironmentInput:
      type: object
      additionalProperties: false
      required: [name, paradigmKey, revision]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        paradigmKey: {$ref: '#/components/schemas/ConstantKey'}
        notes: {type: string, maxLength: 2000}
        revision: {$ref: '#/components/schemas/EnvironmentRevisionInput'}
    EnvironmentPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: An empty notes value clears the notes
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        notes: {type: string, maxLength: 2000}
    Protocol:
      type: object
      required: [id, experimentId, name, description, latestVersion, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        experimentId: {type: string, format: uuid}
        name: {type: string}
        description: {type: [string, 'null']}
        latestVersion: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ProtocolStep:
      type: object
      required: [position, paradigmKey, paradigmVersion, environmentId, environmentRevision, environmentRevisionId, trialType, trials, interTrialIntervalS, session, notes]
      properties:
        position: {type: integer, minimum: 1, maximum: 50}
        paradigmKey: {$ref: '#/components/schemas/ConstantKey'}
        paradigmVersion: {type: integer, minimum: 1}
        environmentId: {type: string, format: uuid}
        environmentRevision: {type: integer, minimum: 1, description: Number of the referenced revision}
        environmentRevisionId: {type: string, format: uuid}
        trialType: {$ref: '#/components/schemas/ConstantKey'}
        trials: {type: integer, minimum: 1, maximum: 1000}
        interTrialIntervalS: {type: integer, minimum: 0, maximum: 86400}
        session:
          allOf: [{$ref: '#/components/schemas/ParameterValues'}]
          description: Every session parameter of the paradigm version, with defaults filled in
        notes: {type: [string, 'null']}
    ProtocolStepInput:
      type: object
      additionalProperties: false
      required: [position, paradigmKey, paradigmVersion, environmentRevisionId, trialType, trials]
      properties:
        position: {type: integer, minimum: 1, maximum: 50, description: Positions run from 1 without gaps or duplicates}
        paradigmKey: {$ref: '#/components/schemas/ConstantKey'}
        paradigmVersion: {type: integer, minimum: 1}
        environmentRevisionId: {type: string, format: uuid, description: A revision set up for the same paradigm key and version}
        trialType: {$ref: '#/components/schemas/ConstantKey'}
        trials: {type: integer, minimum: 1, maximum: 1000}
        interTrialIntervalS: {type: integer, minimum: 0, maximum: 86400, default: 0}
        session:
          allOf: [{$ref: '#/components/schemas/ParameterValues'}]
          description: Session parameters of the paradigm version; omitted ones take their defaults
        notes: {type: string, maxLength: 2000}
    ProtocolVersion:
      type: object
      required: [id, experimentId, protocolId, number, notes, createdBy, createdAt, steps]
      description: Immutable; tests reference a fixed version
      properties:
        id: {type: string, format: uuid}
        experimentId: {type: string, format: uuid}
        protocolId: {type: string, format: uuid}
        number: {type: integer, minimum: 1}
        notes: {type: [string, 'null']}
        createdBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        steps: {type: array, items: {$ref: '#/components/schemas/ProtocolStep'}}
    ProtocolVersionInput:
      type: object
      additionalProperties: false
      required: [steps]
      properties:
        notes: {type: string, maxLength: 2000}
        steps: {type: array, minItems: 1, maxItems: 50, items: {$ref: '#/components/schemas/ProtocolStepInput'}}
    ProtocolInput:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 5000}
        version: {$ref: '#/components/schemas/ProtocolVersionInput'}
    ProtocolPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: An empty description clears it
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 5000}
    TestStatus: {type: string, enum: [PLANNED, IN_PROGRESS, COMPLETED, CANCELLED]}
    Test:
      type: object
      required: [id, experimentId, enrollmentId, subjectId, phaseId, groupId, protocolVersionId, stepPosition, paradigmKey, paradigmVersion, environmentRevisionId, plannedTrials, status, scheduledAt, startedAt, completedAt, cancelledAt, cancelReason, notes, createdBy, createdAt, updatedAt]
      description: One session of a subject on one protocol step. Context fields never change; status is the session's own lifecycle, separate from analysis.
      properties:
        id: {type: string, format: uuid}
        experimentId: {type: string, format: uuid}
        enrollmentId: {type: string, format: uuid}
        subjectId: {type: string, format: uuid}
        phaseId: {type: [string, 'null'], format: uuid}
        groupId: {type: [string, 'null'], format: uuid, description: The subject's group at the scheduled time}
        protocolVersionId: {type: string, format: uuid}
        stepPosition: {type: integer, minimum: 1}
        paradigmKey: {$ref: '#/components/schemas/ConstantKey'}
        paradigmVersion: {type: integer, minimum: 1}
        environmentRevisionId: {type: string, format: uuid}
        plannedTrials: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/TestStatus'}
        scheduledAt: {type: string, format: date-time}
        startedAt: {type: [string, 'null'], format: date-time}
        completedAt: {type: [string, 'null'], format: date-time}
        cancelledAt: {type: [string, 'null'], format: date-time}
        cancelReason: {type: [string, 'null']}
        notes: {type: [string, 'null']}
        createdBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    TestInput:
      type: object
      additionalProperties: false
      required: [enrollmentId, protocolVersionId, stepPosition, scheduledAt]
      properties:
        enrollmentId: {type: string, format: uuid, description: An enrollment of this experiment; the subject comes from it}
        phaseId: {type: string, format: uuid}
        protocolVersionId: {type: string, format: uuid, description: A protocol version of this experiment}
        stepPosition: {type: integer, minimum: 1}
        scheduledAt: {type: string, format: date-time, description: Not before the enrollment}
        notes: {type: string, maxLength: 2000}
    Trial:
      type: object
      required: [id, testId, number, repetition, attempt, startedAt, endedAt, notes, recordedBy, createdAt]
      description: Immutable; a repeated repetition is a new attempt
      properties:
        id: {type: string, format: uuid}
        testId: {type: string, format: uuid}
        number: {type: integer, minimum: 1, description: Recording order within the test}
        repetition: {type: integer, minimum: 1}
        attempt: {type: integer, minimum: 1}
        startedAt: {type: string, format: date-time}
        endedAt: {type: [string, 'null'], format: date-time}
        notes: {type: [string, 'null']}
        recordedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
    TrialInput:
      type: object
      additionalProperties: false
      required: [repetition, startedAt]
      properties:
        repetition: {type: integer, minimum: 1, description: At most the planned trials of the step}
        startedAt: {type: string, format: date-time, description: Not before the test started}
        endedAt: {type: string, format: date-time, description: After startedAt}
        notes: {type: string, maxLength: 2000}
    Comment:
      type: object
      required: [id, testId, authorId, authorName, body, edited, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        testId: {type: string, format: uuid}
        authorId: {type: string, format: uuid}
        authorName: {type: [string, 'null'], description: Null once the author's account is deleted}
        body: {type: string, description: Plain text; render it escaped}
        edited: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CommentInput:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: {type: string, minLength: 1, maxLength: 2000, description: Control characters other than tab and line breaks are removed before the length check}
    Probe:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    Problem:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error: {type: string}
        code: {type: string}
    Role:
      type: string
      enum: [SUPERADMIN, LAB_MANAGER, RESEARCHER, TECHNICIAN, VIEWER]
    Permission:
      type: string
      enum: ['user:manage', 'lab:configure', 'study:write', 'subject:write', 'weight:write', 'apparatus:write', 'test:write', 'test:run', '*:read']
    NewPassword:
      type: string
      description: At least 8 characters and at most 72 UTF-8 bytes; compared byte for byte
    User:
      type: object
      additionalProperties: false
      required: [id, email, name, role, createdAt]
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        name: {type: string}
        role:
          $ref: '#/components/schemas/Role'
        createdAt: {type: string, format: date-time}
