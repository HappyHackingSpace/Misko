      responses:
        '200':
          description: Updated group
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteGroup
      summary: Delete a group of a draft with its regimen items (study:write); 409 group.inUse while animals are allocated to it
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/experiments/{id}/regimen-items:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: listRegimenItems
      summary: What every group receives, ordered by group code and start day (*:read)
      responses:
        '200':
          description: Regimen items
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/RegimenItem'}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createRegimenItem
      summary: Add a regimen item to a group of a draft (study:write); a group has at most one TREATMENT item
      description: >-
        The purpose must be one the group's role can receive, otherwise 400
        regimen.purposeNotAllowed: HEALTHY_CONTROL only NONE; SHAM only
        VEHICLE; DISEASE_CONTROL INDUCTION or VEHICLE; POSITIVE_CONTROL and
        TREATMENT INDUCTION, VEHICLE or TREATMENT. A NONE item is a period in
        which a healthy control receives no substance at all: it has only
        groupId, purpose, startDay and endDay, and any substance, amount, unit,
        route, frequency or interval is 400 regimen.noSubstanceFields. Every
        other purpose needs all of them. A second TREATMENT item of a group is
        409 regimen.treatmentTaken.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegimenItemInput'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegimenItem'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/experiments/{id}/regimen-items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/ID'
      - {name: itemId, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: updateRegimenItem
      summary: Update a regimen item of a draft (study:write)
      description: >-
        The resulting purpose must be one the item's group can receive (400
        regimen.purposeNotAllowed, see createRegimenItem). Changing the purpose
        to NONE drops the substance, amount, unit, route, frequency and interval
        the patch does not name; naming one is 400 regimen.noSubstanceFields.
        A VEHICLE item of a healthy control written before NONE existed can
        only become a NONE item or be deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegimenItemPatch'}
      responses:
        '200':
          description: Updated regimen item
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegimenItem'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteRegimenItem
      summary: Delete a regimen item of a draft (study:write)
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/experiments/{id}/timepoints:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: listTimepoints
      summary: Timepoints ordered by position (*:read)
      responses:
        '200':
          description: Timepoints
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Timepoint'}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
