openapi: 3.1.0
info:
  title: Misko API
  version: 0.2.0
  description: >-
    Health, authentication, user management, the laboratory, studies, tests,
    the analysis service (jobs and workers) and paradigm trials.
    Every error response carries a stable `code` and an English `error` message.
    401 means missing, invalid, expired or revoked credentials; 403 means the
    current role lacks the permission. Roles are read from the database on every
    request, never from the token.
security:
  - bearer: []
paths:
  /api/health:
    get:
      operationId: getLiveness
      summary: Process liveness; independent of PostgreSQL
      security: []
      responses:
        '200':
          description: Process is accepting HTTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probe'
  /api/ready:
    get:
      operationId: getReadiness
      summary: PostgreSQL schema is installed and the process is not draining
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probe'
        '503':
          description: Dependency unavailable, schema missing, or process draining
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probe'
  /api/meta:
    get:
      operationId: getMeta
      summary: Public branding for the sign-in screen
      security: []
      responses:
        '200':
          description: Application and laboratory name; labName is null before setup
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [appName, labName]
                properties:
                  appName: {type: string}
                  labName: {type: [string, 'null']}
  /api/auth/login:
    post:
      operationId: login
      summary: Exchange email and password for a bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: {type: string}
                password: {type: string}
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          description: auth.invalidCredentials; unknown accounts and wrong passwords are indistinguishable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/auth/me:
    get:
      operationId: getCurrentUser
      summary: Current user and the permissions of their current role
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user, permissions]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  permissions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Permission'
        '401':
          $ref: '#/components/responses/Problem'
  /api/auth/password:
    post:
      operationId: changeOwnPassword
      summary: Change the caller's password; all earlier tokens are revoked
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword: {type: string}
                newPassword:
                  $ref: '#/components/schemas/NewPassword'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /api/users:
    get:
      operationId: listUsers
      summary: List users (user:manage)
      parameters:
        - {name: search, in: query, schema: {type: string, maxLength: 100}, description: Case-insensitive match on name or email}
        - {name: role, in: query, schema: {$ref: '#/components/schemas/Role'}}
        - {name: sort, in: query, schema: {type: string, enum: [name, email, role, createdAt], default: createdAt}}
        - {name: order, in: query, schema: {type: string, enum: [asc, desc]}, description: Defaults to desc for createdAt and asc otherwise}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 10}, description: Values above 100 are capped}
      responses:
        '200':
          description: One page of users, ordered with id as a stable tie-breaker
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, total, page, pageSize]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  total: {type: integer}
                  page: {type: integer}
                  pageSize: {type: integer}
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createUser
      summary: Create a user (user:manage); there is no public signup
      description: Role SUPERADMIN is never accepted here (403 user.superAdminProtected); that account is created once, by the setup command.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, name, role]
              properties:
                email: {type: string, maxLength: 254}
                name: {type: string, minLength: 1, maxLength: 120}
                role:
                  $ref: '#/components/schemas/Role'
                password:
                  $ref: '#/components/schemas/NewPassword'
      responses:
        '201':
          description: Created; generatedPassword is present only when no password was supplied
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  generatedPassword: {type: string}
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/users/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getUser
      summary: Get a user (user:manage)
      responses:
        '200':
          $ref: '#/components/responses/User'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateUser
      summary: Rename a user or change their role (user:manage)
      description: The last SUPERADMIN or LAB_MANAGER cannot be demoted to an unprivileged role (409 user.lastPrivileged). The SUPERADMIN account cannot be renamed, role-changed or promoted into, by anyone including itself through this route (403 user.superAdminProtected).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '200':
          $ref: '#/components/responses/User'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteUser
      summary: Delete a user (user:manage)
      description: Users cannot delete themselves (400 user.cannotDeleteSelf) and the last privileged user remains (409 user.lastPrivileged). The SUPERADMIN account can never be deleted (403 user.superAdminProtected).
      responses:
        '204':
          description: Deleted; the user's tokens stop authenticating immediately
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/users/{id}/reset-password:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: resetUserPassword
      summary: Set another user's password and revoke their tokens (user:manage)
      description: Never valid against the SUPERADMIN account (403 user.superAdminProtected); it changes its own password only through POST /api/auth/password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password:
                  $ref: '#/components/schemas/NewPassword'
      responses:
        '200':
          description: generatedPassword is present only when no password was supplied
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  generatedPassword: {type: string}
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/lab:
    get:
      operationId: getLaboratory
      summary: The laboratory singleton (*:read)
      responses:
        '200':
          $ref: '#/components/responses/Laboratory'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateLaboratory
      summary: Update laboratory fields (lab:configure); an empty code clears it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
                code: {type: string, pattern: '^[A-Za-z0-9._-]{0,32}$'}
                timezone: {type: string, description: IANA time zone name}
      responses:
        '200':
          $ref: '#/components/responses/Laboratory'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/subjects:
    get:
      operationId: listSubjects
      summary: List subjects (*:read)
      parameters:
        - {name: search, in: query, schema: {type: string, maxLength: 100}, description: Case-insensitive match on code}
        - {name: species, in: query, schema: {$ref: '#/components/schemas/Species'}}
        - {name: sex, in: query, schema: {$ref: '#/components/schemas/Sex'}}
        - {name: unallocated, in: query, schema: {type: string, enum: ['true', 'false']}, description: 'true keeps only animals not allocated to any group; false does not filter'}
        - {name: sort, in: query, schema: {type: string, enum: [code, species, sex, createdAt], default: createdAt}}
        - {name: order, in: query, schema: {type: string, enum: [asc, desc]}, description: Defaults to desc for createdAt and asc otherwise}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of subjects, ordered with id as a stable tie-breaker
          content:
            application/json:
              schema:
                type: object
                required: [data, total, page, pageSize]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Subject'}}
                  total: {type: integer}
                  page: {type: integer}
                  pageSize: {type: integer}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createSubject
      summary: Create a subject (subject:write)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubjectInput'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subject'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/subjects/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: getSubject
      summary: Get a subject (*:read)
      responses:
        '200':
          description: Subject
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subject'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateSubject
      summary: Update provided subject fields (subject:write)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubjectPatch'}
      responses:
        '200':
          description: Updated subject
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subject'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteSubject
      summary: Delete a subject that is not allocated and has no recorded weights (subject:write)
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/subjects/{id}/weights:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: listWeights
      summary: Body weights of a subject, newest first (*:read)
      responses:
        '200':
          description: Weights
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/WeightMeasurement'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      operationId: recordWeight
      summary: Record a body weight (weight:write); weights never change once recorded
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WeightInput'}}}}
      responses:
        '201': {description: Recorded, content: {application/json: {schema: {$ref: '#/components/schemas/WeightMeasurement'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/catalog/substances:
    get:
      operationId: listSubstances
      summary: Substances ordered by name (*:read)
      parameters:
        - {name: search, in: query, schema: {type: string, maxLength: 100}, description: Case-insensitive match on name}
        - {name: kind, in: query, schema: {$ref: '#/components/schemas/SubstanceKind'}}
      responses:
        '200':
          description: Substances
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/Substance'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createSubstance
      summary: Create a substance (study:write)
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SubstanceInput'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Substance'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/catalog/substances/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: getSubstance
      summary: One substance (*:read)
      responses:
        '200': {description: Substance, content: {application/json: {schema: {$ref: '#/components/schemas/Substance'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateSubstance
      summary: Update provided substance fields (study:write)
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SubstancePatch'}}}}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Substance'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteSubstance
      summary: Delete a substance no regimen item or administration uses (study:write)
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/catalog/disease-models:
    get:
      operationId: listDiseaseModels
      summary: Disease models ordered by name (*:read)
      parameters:
        - {name: search, in: query, schema: {type: string, maxLength: 100}, description: Case-insensitive match on name}
        - {name: inductionType, in: query, schema: {$ref: '#/components/schemas/InductionType'}}
      responses:
        '200':
          description: Disease models
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/DiseaseModel'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createDiseaseModel
      summary: Create a disease model (study:write)
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DiseaseModelInput'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/DiseaseModel'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/catalog/disease-models/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: getDiseaseModel
      summary: One disease model (*:read)
      responses:
        '200': {description: Disease model, content: {application/json: {schema: {$ref: '#/components/schemas/DiseaseModel'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateDiseaseModel
      summary: Update provided disease model fields (study:write)
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DiseaseModelPatch'}}}}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/DiseaseModel'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteDiseaseModel
      summary: Delete a disease model no experiment group uses (study:write)
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/experiments:
    get:
      operationId: listExperiments
      summary: List experiments (*:read)
      parameters:
        - {name: search, in: query, schema: {type: string, maxLength: 100}, description: Case-insensitive match on code or title}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/ExperimentStatus'}}
        - {name: sort, in: query, schema: {type: string, enum: [code, title, createdAt], default: createdAt}}
        - {name: order, in: query, schema: {type: string, enum: [asc, desc]}, description: Defaults to desc for createdAt and asc otherwise}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of experiments
          content:
            application/json:
              schema:
                type: object
                required: [data, total, page, pageSize]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Experiment'}}
                  total: {type: integer}
                  page: {type: integer}
                  pageSize: {type: integer}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createExperiment
      summary: Create a draft experiment (study:write)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExperimentInput'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Experiment'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/experiments/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: getExperiment
      summary: One experiment (*:read)
      responses:
        '200':
          description: Experiment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Experiment'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateExperiment
      summary: Update provided experiment fields (study:write)
      description: >-
        Code, title and description change until the experiment completes;
        hypothesis, randomisation and blinded only in a draft
        (409 experiment.designFrozen). A completed experiment answers 409
        experiment.completed.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExperimentPatch'}
      responses:
        '200':
          description: Updated experiment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Experiment'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/experiments/{id}/readiness:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: getExperimentReadiness
      summary: The start rules the design does not meet yet (*:read)
      responses:
        '200':
          description: Readiness; ready is true when unmet is empty
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/experiments/{id}/start:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: startExperiment
      summary: Start a draft with its day 0 (study:write)
      description: >-
        Runs the start rules (see Readiness) and moves the experiment to
        RUNNING. Groups, regimen items, timepoints and endpoints are frozen
        afterwards. 422 experiment.notReady lists the unmet rules; 409
        experiment.notDraft when it already started.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [dayZero]
              properties:
                dayZero: {type: string, format: date, description: The date study day 0 falls on}
      responses:
        '200':
          description: Running experiment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Experiment'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422':
          description: experiment.notReady with the unmet start rules
          content:
            application/json:
              schema:
                type: object
                required: [error, code, unmet]
                properties:
                  error: {type: string}
                  code: {type: string, const: experiment.notReady}
                  unmet: {type: array, items: {$ref: '#/components/schemas/ReadinessProblem'}}
  /api/experiments/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: completeExperiment
      summary: Complete a running experiment; it becomes read-only (study:write)
      description: >-
        409 experiment.testsOpen while a test is planned or in progress;
        409 experiment.notRunning unless the experiment is running.
      responses:
        '200':
          description: Completed experiment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Experiment'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/experiments/{id}/metric-options:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: listEndpointMetricOptions
      summary: Paradigm versions run by the experiment's protocol steps with the metrics an endpoint can name (*:read)
      responses:
        '200':
          description: Options ordered by paradigm key and version
          content:
            application/json:
              schema:
                type: object
                required: [data]
