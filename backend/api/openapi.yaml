      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TestSubjectInput'}}}}
      responses:
        '201': {description: The test with its animals, content: {application/json: {schema: {$ref: '#/components/schemas/Test'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/tests/{id}/subjects/{subjectId}:
    parameters:
      - $ref: '#/components/parameters/ID'
      - {name: subjectId, in: path, required: true, schema: {type: string, format: uuid}, description: Test subject id (an animal of this test)}
    delete:
      operationId: removeTestSubject
      summary: Remove an animal from a planned test (test:write); the last animal stays (409 test.lastSubject), cancel the test instead
      responses:
        '200': {description: The test with its remaining animals, content: {application/json: {schema: {$ref: '#/components/schemas/Test'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/tests/{id}/start:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: startTest
      summary: Start a planned test (test:run); an animal excluded since planning must be removed first (409 test.subjectExcluded)
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {startedAt: {type: string, format: date-time, description: Defaults to now}}}}}}
      responses:
        '200': {description: Started, content: {application/json: {schema: {$ref: '#/components/schemas/Test'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/tests/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: completeTest
      summary: Complete a test in progress in which every animal has at least one trial (test:run)
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {completedAt: {type: string, format: date-time, description: Defaults to now}}}}}}
      responses:
        '200': {description: Completed, content: {application/json: {schema: {$ref: '#/components/schemas/Test'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/tests/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: cancelTest
      summary: Cancel a planned test or one in progress (test:write); animals and trials are kept, the animals may join another test of the slot
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [reason], properties: {reason: {type: string, minLength: 1, maxLength: 2000}}}}}}
      responses:
        '200': {description: Cancelled, content: {application/json: {schema: {$ref: '#/components/schemas/Test'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/tests/{id}/subjects/{subjectId}/trials:
    parameters:
      - $ref: '#/components/parameters/ID'
      - {name: subjectId, in: path, required: true, schema: {type: string, format: uuid}, description: Test subject id (an animal of this test)}
    get:
      operationId: listTrials
      summary: Trials of one animal of a test in recording order (*:read)
      responses:
        '200':
          description: Trials
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/Trial'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      operationId: recordTrial
      summary: Append a trial of one animal to a test in progress (test:run); repeating a repetition adds an attempt
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TrialInput'}}}}
      responses:
        '201': {description: Recorded, content: {application/json: {schema: {$ref: '#/components/schemas/Trial'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/tests/{id}/comments:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: listTestComments
      summary: Comments on a test, oldest first (any signed-in user)
      responses:
        '200':
          description: Comments
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/Comment'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createTestComment
      summary: Comment on a test (any signed-in user, at most 20 comment changes per minute)
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CommentInput'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Comment'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/tests/{id}/comments/{commentId}:
    parameters:
      - $ref: '#/components/parameters/ID'
      - {name: commentId, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: updateTestComment
      summary: Edit your own comment (author only; counts toward the comment limit)
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CommentInput'}}}}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Comment'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteTestComment
      summary: Delete a comment (its author, SUPERADMIN or LAB_MANAGER)
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/tests/{id}/recordings:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: listRecordings
      summary: Every video of a test, oldest first, with its status (*:read)
      description: A test has one current recording (current is true); each replacement supersedes the previous one, which stays for provenance.
      responses:
        '200':
          description: Recordings
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/Recording'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      operationId: startRecordingUpload
      summary: Declare an original video, attach it as the test's current video and get a signed request that starts a resumable upload straight to Cloud Storage (test:run)
      description: The test must be IN_PROGRESS or COMPLETED (409 media.testNotStarted otherwise). The new recording supersedes the current one at once, so a replacement makes the test wait for its verification. Send upload.method to upload.url with upload.headers to get the resumable session URI from Cloud Storage, upload the file to it, then call finalize. The signed request carries x-goog-content-length-range, so storage refuses more bytes than sizeBytes. It is returned once and never stored. 409 media.concurrentUpload when another video was attached at the same moment; retry.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecordingUploadInput'}}}}
      responses:
        '201':
          description: Upload started
          content:
            application/json:
              schema:
                type: object
                required: [recording, upload]
                properties:
                  recording: {$ref: '#/components/schemas/Recording'}
                  upload: {$ref: '#/components/schemas/SignedUpload'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/tests/{id}/recordings/current:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: getCurrentRecording
      summary: The test's current video (*:read)
      description: 404 recording.notFound while the test has no video.
      responses:
        '200': {description: Current recording, content: {application/json: {schema: {$ref: '#/components/schemas/Recording'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/tests/{id}/recordings/{recordingId}/finalize:
    parameters:
      - $ref: '#/components/parameters/ID'
      - {name: recordingId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: finalizeRecordingUpload
      summary: Verify the stored object and record the result (test:run; the uploader, LAB_MANAGER or SUPERADMIN)
      description: Size, CRC32C and content type are compared with the declaration. A mismatch stores status REJECTED with a reason. Finalizing again returns the stored result.
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false}}}}
      responses:
        '200': {description: Verified or rejected, content: {application/json: {schema: {$ref: '#/components/schemas/Recording'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/tests/{id}/recordings/{recordingId}/read-url:
    parameters:
      - $ref: '#/components/parameters/ID'
      - {name: recordingId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getRecordingReadUrl
      summary: A short-lived signed URL for the verified video generation (*:read); supports HTTP range requests
      responses:
        '200':
          description: Signed read URL
          content:
            application/json:
              schema: {type: object, required: [url, expiresAt], properties: {url: {type: string, format: uri}, expiresAt: {type: string, format: date-time}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/environments/{id}/revisions/{number}/calibrations:
    parameters:
      - $ref: '#/components/parameters/ID'
      - {name: number, in: path, required: true, schema: {type: integer, minimum: 1}}
    get:
      operationId: listEnvironmentCalibrations
      summary: Default calibrations of an environment revision, oldest first (*:read)
      responses:
        '200':
          description: Calibrations
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/Calibration'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createEnvironmentCalibration
      summary: Calibrate the environment revision once; every animal tested in this arena uses it unless it has an override on its test's current video (apparatus:write)
      description: Same fitting and validation as an override, against the revision's measurements. Its crop is this arena's region of the fixed camera frame, so arenas filmed together each have their own. There is no video, so referenceFrameUs is ignored. A correction must supersede the latest calibration of the revision and use the same camera and frame size. Analysis runs that already pinned an earlier calibration keep it. Answers calibration.notRequired for paradigms without max_calibration_error_cm.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EnvironmentCalibrationInput'}}}}
      responses:
        '201': {description: Stored, content: {application/json: {schema: {$ref: '#/components/schemas/Calibration'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/environments/{id}/revisions/{number}/calibration-status:
    parameters:
      - $ref: '#/components/parameters/ID'
      - {name: number, in: path, required: true, schema: {type: integer, minimum: 1}}
    get:
      operationId: getEnvironmentCalibrationStatus
      summary: Whether animals tested in the revision's arena are calibrated by default (*:read)
      responses:
        '200':
          description: Calibration status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalibrationStatus'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/tests/{id}/calibration-status:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: getTestCalibrationStatus
      summary: For every animal of the test, whether its part of the current video can be analysed into physical metrics (*:read)
      description: Read from the effective_calibrations view, the rule the analysis scheduler uses. An animal's own latest override on the current video decides when it has one (a REJECTED one leaves it waiting), otherwise the latest default of its arena.
      responses:
        '200':
          description: Calibration status per test subject
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/SubjectCalibrationStatus'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/tests/{id}/subjects/{testSubjectId}/calibrations:
    parameters:
      - $ref: '#/components/parameters/ID'
      - {name: testSubjectId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listCalibrationOverrides
      summary: The animal's own calibrations over every video of the test, oldest first (*:read)
      description: Overrides only; the default of its arena is listed under the environment revision. recordingId names the video each one was read from.
      responses:
        '200':
          description: Calibrations
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/Calibration'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createCalibrationOverride
      summary: Manually calibrate this animal's arena on the test's current video, overriding the arena default for that video only (test:run)
      description: The test needs a current, verified video (409 calibration.noVideo, calibration.videoNotVerified). Fits a pixel-to-centimeter transform from FIT points and validates it with independent CHECK points. An animal with an override on the current video never falls back to its arena default, so a REJECTED one leaves it waiting. The result is VALID, or REJECTED with EXCESSIVE_CHECK_ERROR when CHECK points deviate more than the paradigm's max_calibration_error_cm. The overrides of an animal form one chain across the test's videos, so a correction, also the first one on a replacement video, must supersede the latest of them; within one video it must keep the camera and frame size.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CalibrationInput'}}}}
      responses:
        '201': {description: Stored, content: {application/json: {schema: {$ref: '#/components/schemas/Calibration'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/tests/{id}/subjects/{testSubjectId}/calibration-status:
    parameters:
      - $ref: '#/components/parameters/ID'
      - {name: testSubjectId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getSubjectCalibrationStatus
      summary: Whether this animal's part of the current video can be analysed into physical metrics (*:read)
      responses:
        '200':
          description: Calibration status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubjectCalibrationStatus'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/analysis/workers:
    get:
      operationId: listAnalysisWorkers
      summary: Registered analysis workers (lab:configure)
      responses:
        '200':
          description: Workers
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/AnalysisWorker'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: registerAnalysisWorker
      summary: Register an analysis worker; the token is returned once (lab:configure)
      description: Capabilities must name tracked paradigm versions, whose metrics the engine computes from a trajectory and, for calibrated zones, the shapes of the run's pinned calibration; versions outside the catalog return worker.unknownCapability.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisWorkerInput'}}}}
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                type: object
                required: [worker, token]
                properties:
                  worker: {$ref: '#/components/schemas/AnalysisWorker'}
                  token: {type: string, description: 'Shown once; send as "Authorization: Worker TOKEN". Only its SHA-256 hash is stored.'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/analysis/workers/{id}/disable:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: disableAnalysisWorker
      summary: Revoke a worker token; its running leases expire normally (lab:configure)
      responses:
        '200': {description: Disabled, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisWorker'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/analysis/capabilities:
    get:
      operationId: listAnalysisCapabilities
      summary: Paradigm versions that enabled workers can analyze (*:read)
      responses:
        '200':
          description: Capabilities
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/AnalysisCapability'}}}}
        '401': {$ref: '#/components/responses/Problem'}
  /api/analysis/test-subjects/{testSubjectId}/runs:
    parameters:
      - {name: testSubjectId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: reanalyzeTestSubject
      summary: Submit a manual analysis job of one animal of a test with the current inputs; earlier jobs and the reviewed result are kept (test:run)
      description: >-
        The experiment side submits a job to the analysis service with the test's current video and the
        effective calibration of the animal's arena (its own override for this video, else the arena default),
        and links it to the animal. Returns analysis.notReady until the current video is verified, the test is
        not cancelled, the experiment is running or completed, the animal is not excluded and a VALID
        calibration with every required zone applies when the paradigm requires one. The job waits in the
        queue until a worker with the capability claims it. Returns analysis.runPending while an earlier job of
        the same animal is still queued or running, so a repeated request cannot flood the workers.
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false}}}}
      responses:
        '201': {description: Queued, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisRun'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/tests/{id}/analysis-runs:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: listAnalysisRuns
      summary: Analysis jobs of the animals of a test, newest first, optionally of one animal (*:read)
      parameters:
        - {name: testSubjectId, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Runs
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/AnalysisRun'}}}}
        '401': {$ref: '#/components/responses/Problem'}
  /api/analysis/jobs/{jobId}:
    parameters:
      - {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getAnalysisJob
      summary: A job of the analysis service with what it published (*:read)
      description: Used by both the experiment screens and paradigm trials. result is null until the job succeeded, except for a job QC failed, whose result carries only qc.
      responses:
        '200': {description: Job, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisJobDetail'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/analysis/jobs/{jobId}/video-pair:
    parameters:
      - {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getAnalysisVideoPair
      summary: Signed reads of the pinned original generation and this job's analysed video (*:read)
      responses:
        '200': {description: Video pair, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisVideoPair'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/analysis/jobs/{jobId}/outputs/{kind}/read-url:
    parameters:
      - {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: kind, in: path, required: true, schema: {type: string, enum: [ANALYZED_VIDEO, TRAJECTORY, THUMBNAIL]}}
    get:
      operationId: getAnalysisOutputURL
      summary: Signed read of one published output of a succeeded job, such as the trajectory for drawing the track (*:read)
      responses:
        '200': {description: Signed read, content: {application/json: {schema: {$ref: '#/components/schemas/ReadLink'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/analysis-runs/{jobId}:
    parameters:
      - {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getAnalysisRun
      deprecated: true
      summary: Old name of GET /api/analysis/jobs/{jobId}, kept while the panel moves (*:read)
      responses:
        '200': {description: Job, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisJobDetail'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/analysis-runs/{jobId}/video-pair:
    parameters:
      - {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getAnalysisRunVideoPair
      deprecated: true
      summary: Old name of GET /api/analysis/jobs/{jobId}/video-pair (*:read)
      responses:
        '200': {description: Video pair, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisVideoPair'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/analysis/results:
    get:
      operationId: listAnalysisResults
      summary: Analysis results of animals for review, oldest first (*:read)
      description: >-
        Lists PENDING results by default. In a blinded experiment group is null: the reviewer sees only
        the animal, arena and test. newerRunAvailable reports a succeeded run newer than the one under review.
      parameters:
        - {name: experimentId, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string, enum: [PENDING, ACCEPTED, REJECTED, ALL], default: PENDING}}
        - $ref: '#/components/parameters/Page'
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}, description: Values above 200 are capped}
      responses:
        '200':
          description: Page of results
          content:
            application/json:
              schema: {type: object, required: [data, total, page, pageSize], properties: {data: {type: array, items: {$ref: '#/components/schemas/AnalysisReviewItem'}}, total: {type: integer}, page: {type: integer}, pageSize: {type: integer}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /api/analysis/results/bulk-accept:
    post:
      operationId: acceptAnalysisResults
      summary: Accept several results at once, all or none (test:run)
      description: Needs 1 to 100 distinct test subjects; any missing result or closed experiment rejects the whole request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [testSubjectIds]
              properties:
                testSubjectIds: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string, format: uuid}}
                note: {type: string, maxLength: 2000}
      responses:
        '200':
          description: Accepted results in request order
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/AnalysisReviewItem'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/analysis/results/{testSubjectId}:
    parameters:
      - {name: testSubjectId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getAnalysisResult
      summary: One animal's result with every succeeded run a reviewer can choose (*:read)
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AnalysisReviewItem'
                  - type: object
                    required: [runs]
                    properties:
                      runs: {type: array, description: Succeeded runs of the animal, newest first, items: {$ref: '#/components/schemas/AnalysisRun'}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/analysis/results/{testSubjectId}/accept:
    parameters:
      - {name: testSubjectId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: acceptAnalysisResult
      summary: Accept an animal's result so it enters the statistics (test:run)
      description: Decisions can be revised while the experiment runs; a completed experiment returns analysis.experimentClosed.
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {note: {type: string, maxLength: 2000}}}}}}
      responses:
        '200': {description: Accepted, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisReviewItem'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/analysis/results/{testSubjectId}/reject:
    parameters:
      - {name: testSubjectId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: rejectAnalysisResult
      summary: Reject an animal's result with a reason; it stays visible but out of statistics (test:run)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {$ref: '#/components/schemas/RejectionReason'}
                note: {type: string, maxLength: 2000}
      responses:
        '200': {description: Rejected, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisReviewItem'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/analysis/results/{testSubjectId}/run:
    parameters:
      - {name: testSubjectId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: chooseAnalysisRun
      summary: Put another succeeded job of the same animal under review; the result returns to PENDING (test:run)
      description: The job is named jobId, or runId as the panel sends it. A job linked to no animal of a test (such as a paradigm trial's) returns analysis.runNotFound; a job of another animal or one that has not succeeded returns analysis.runNotChosen. Choosing the current job reopens it.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, properties: {jobId: {type: string, format: uuid}, runId: {type: string, format: uuid, description: Old name of jobId}}}
      responses:
        '200': {description: Back to review, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisReviewItem'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/trials:
    post:
      operationId: createTrial
      summary: Start a paradigm trial of a paradigm version in an arena of that version (trial:run)
      description: >-
        A paradigm trial tries the automatic analysis on one video outside any experiment: no groups, no review,
        no report. The arena must run the named paradigm version (400 trial.paradigmMismatch).
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TrialInput'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Trial'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    get:
      operationId: listTrials
      summary: Paradigm trials, newest first, with their arena and newest analysis job (*:read)
      parameters:
        - {name: search, in: query, schema: {type: string, maxLength: 120}, description: Part of the name, ignoring case}
        - {name: paradigmKey, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: Trials
          content:
            application/json:
              schema:
                type: object
                required: [data, total, page, pageSize]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/TrialSummary'}}
                  total: {type: integer}
                  page: {type: integer}
                  pageSize: {type: integer}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /api/trials/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: getTrial
      summary: A trial with its arena, video, calibration in use and every analysis, newest first (*:read)
      responses:
        '200': {description: Trial, content: {application/json: {schema: {$ref: '#/components/schemas/TrialDetail'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteTrial
      summary: Hide a trial; its analysis jobs never change and stay readable (trial:run)
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/trials/{id}/video:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: startTrialUpload
      summary: Declare the trial's video and get a signed request that starts a resumable upload straight to storage (trial:run)
      description: The new video becomes the trial's current one; earlier analyses keep the video they analysed. The clip is the part to analyse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fileName, contentType, sizeBytes, crc32c]
              properties:
                fileName: {type: string, minLength: 1, maxLength: 255}
                contentType: {type: string, enum: [video/mp4, video/quicktime, video/webm]}
                sizeBytes: {type: integer, format: int64, minimum: 1}
                crc32c: {type: string, description: Base64 big-endian CRC32C}
                clipStartUs: {type: integer, format: int64, minimum: 0}
                clipEndUs: {type: [integer, 'null'], format: int64}
      responses:
        '201':
          description: Upload started
          content:
            application/json:
              schema:
                type: object
                required: [trial, video, upload]
                properties:
                  trial: {$ref: '#/components/schemas/Trial'}
                  video: {$ref: '#/components/schemas/TrialVideo'}
                  upload: {type: object, required: [method, url, headers, expiresAt], properties: {method: {type: string}, url: {type: string}, headers: {type: object, additionalProperties: {type: string}}, expiresAt: {type: string, format: date-time}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/trials/{id}/video/finalize:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: finalizeTrialUpload
      summary: Verify the stored video and, once verified, submit the automatic analysis when the trial is ready (trial:run)
      description: >-
        A trial whose paradigm needs a calibration is ready once its own calibration on this video, or else its
        arena's default, is VALID with every required zone; a trial calibrated later is analysed by the next
        scheduler tick. Only one automatic analysis is submitted per video.
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false}}}}
      responses:
        '200': {description: Trial, content: {application/json: {schema: {$ref: '#/components/schemas/TrialDetail'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/trials/{id}/video/read-url:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: getTrialVideoURL
      summary: Signed read of the trial's verified video, for calibrating on it and playback (*:read)
      responses:
        '200': {description: Signed read, content: {application/json: {schema: {$ref: '#/components/schemas/ReadLink'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/trials/{id}/analyses:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: analyseTrial
      summary: Analyse the trial's current video again, with changed ANALYSIS thresholds; earlier analyses are kept for comparison (trial:run)
      description: overrides may name only ANALYSIS parameters of the paradigm version, within range (400 trial.invalidOverrides). 409 trial.notReady while the video or the calibration is missing.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, properties: {overrides: {type: object, additionalProperties: {type: number}}}}
      responses:
        '201': {description: Submitted, content: {application/json: {schema: {$ref: '#/components/schemas/TrialAnalysis'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/trials/{id}/calibrations:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: listTrialCalibrations
      summary: The trial's own calibrations over its videos, oldest first (*:read)
      responses:
        '200':
          description: Calibrations
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/Calibration'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createTrialCalibration
      summary: Calibrate the trial's arena on the trial's current, verified video (trial:run)
      description: The calibration belongs to the trial and its current video and never changes the environment. 409 calibration.trialNoVideo or calibration.videoNotVerified without a verified video. Like an override, the trial's calibrations form one chain across its videos.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CalibrationInput'}}}}
      responses:
        '201': {description: Stored, content: {application/json: {schema: {$ref: '#/components/schemas/Calibration'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/trials/{id}/calibration-status:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: getTrialCalibrationStatus
      summary: Whether the trial's current video can be analysed and with which calibration (source TRIAL or ENVIRONMENT) (*:read)
      responses:
        '200': {description: Status, content: {application/json: {schema: {$ref: '#/components/schemas/CalibrationStatus'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/worker/claim:
    post:
      operationId: claimAnalysisJob
      summary: Lease the oldest available queued job this worker can analyze (worker token)
      description: >-
        A job analyses one video with one paradigm version, its parameters and, when the paradigm needs one, a
        snapshot of a calibration whose crop is the arena's region of the frame. The requester is an animal of a
        test or a paradigm trial; the job never names the animal's group or treatment. The routes keep the name
        "runs": a run id is a job id.
      security: [{worker: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false}}}}
      responses:
        '200':
          description: Claimed; attempt is the fencing token for every later call
          content:
            application/json:
              schema:
                type: object
                required: [run, job, requester, testSubject, outputPrefix, trajectorySchema, contract, calibration]
                properties:
                  run: {$ref: '#/components/schemas/AnalysisJob'}
                  job: {$ref: '#/components/schemas/AnalysisJob'}
                  requester: {$ref: '#/components/schemas/AnalysisRequester'}
                  testSubject:
                    description: The animal of a TEST_SUBJECT job, for logs; null for a paradigm trial
                    oneOf:
                      - type: 'null'
                      - {type: object, required: [id], properties: {id: {type: string, format: uuid}}}
                  outputPrefix: {type: string, description: 'jobs/{jobId}/attempts/{attempt}/'}
                  trajectorySchema: {type: string, enum: [misko.trajectory.v1], description: The trajectory format the result must upload; its runId is the job id}
                  contract: {$ref: '#/components/schemas/AnalysisContract'}
                  calibration:
                    description: The job's calibration snapshot, or null for paradigms without one
                    oneOf:
                      - type: 'null'
                      - {$ref: '#/components/schemas/AnalysisCalibration'}
        '204': {description: No job is available}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/worker/runs/{runId}/heartbeat:
    parameters:
      - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: heartbeatAnalysisRun
      summary: Extend the lease of the current attempt (worker token)
      security: [{worker: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisAttempt'}}}}
      responses:
        '200': {description: Extended, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisJob'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/worker/runs/{runId}/source-url:
    parameters:
      - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: getAnalysisSourceUrl
      summary: Signed read of the pinned source generation (worker token)
      security: [{worker: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisAttempt'}}}}
      responses:
        '200':
          description: Signed read URL
          content:
            application/json:
              schema: {type: object, required: [url, expiresAt], properties: {url: {type: string, format: uri}, expiresAt: {type: string, format: date-time}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/worker/runs/{runId}/outputs:
    parameters:
      - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: requestAnalysisOutput
      summary: Declare an output of the current attempt and sign its upload (worker token)
      security: [{worker: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisOutputInput'}}}}
      responses:
        '201':
          description: Declared
          content:
            application/json:
              schema:
                type: object
                required: [objectName, upload]
                properties:
                  objectName: {type: string}
                  upload: {$ref: '#/components/schemas/SignedUpload'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/worker/runs/{runId}/result:
    parameters:
      - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: submitAnalysisResult
      summary: Verify the outputs, compute metrics and events from the trajectory and publish them atomically (worker token)
      description: >-
        The API reads the verified TRAJECTORY object (misko.trajectory.v1 JSON, at most 64 MiB), checks it
        belongs to this run, attempt and recording duration, applies the paradigm's measurable QC rules
        (max_lost_frame_ratio against untracked samples, min_tracking_confidence against the mean confidence
        of tracked samples) and runs the Go metric engine with the run's pinned parameters. A trajectory that
        fails QC fails the run without retry and returns the FAILED run with a QC_FAILED reason. Delivering
        the accepted result again returns the run without publishing anything new.
      security: [{worker: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisResultInput'}}}}
      responses:
        '200': {description: Published, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisJob'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/worker/runs/{runId}/failure:
    parameters:
      - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: failAnalysisRun
      summary: Report a failure of the current attempt (worker token)
      description: A retryable failure returns the run to the queue while attempts remain; otherwise the run is FAILED.
      security: [{worker: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [attempt, reason, retryable]
              properties:
                attempt: {type: integer, minimum: 1}
                reason: {type: string, minLength: 1, maxLength: 2000}
                retryable: {type: boolean}
      responses:
        '200': {description: Recorded, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisJob'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/experiments/{id}/report:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: experimentReport
      summary: Study report per endpoint and timepoint with group statistics and role-based comparisons (*:read)
      description: >-
        The experimental unit is the animal: each animal contributes one value per timepoint, the mean of its
        accepted results there. Only ACCEPTED results of animals that are not excluded count; pending, rejected,
        unanalysed and missing results are counted per group so a half-reviewed report is never mistaken for a
        final one. Values of different paradigm versions, metric engine versions or units are never pooled: the
        section lists them in versions and sets comparable to false, with no means or comparisons. Comparisons
        follow the group roles: model validity (disease control vs healthy control and sham), assay sensitivity
        (positive control vs disease control) and efficacy (treatment vs disease control), both with rescue
        percent, and dose response (treatment groups of one substance by dose).
      parameters:
        - {name: endpointId, in: query, schema: {type: string, format: uuid}, description: Report this endpoint only}
      responses:
        '200': {description: Report, content: {application/json: {schema: {$ref: '#/components/schemas/StudyReport'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/experiments/{id}/report/export:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: exportExperimentReport
      summary: The report as CSV, per animal or per group and timepoint (*:read)
      description: >-
        level=animals (default) writes one row per animal and test at each endpoint's timepoint and baseline
        with its review status and value; level=groups writes the group statistics of each endpoint at every
        timepoint. At most 100,000 measurements per endpoint; larger reports return report.exportTooLarge. CSV
        text cells starting with =, +, -, @, tab or carriage return are prefixed with an apostrophe.
      parameters:
        - {name: endpointId, in: query, schema: {type: string, format: uuid}}
        - {name: level, in: query, schema: {type: string, enum: [animals, groups], default: animals}}
        - {name: excel, in: query, description: "1 returns UTF-16 LE with a BOM and tab separators, which Excel opens correctly in every locale", schema: {type: string, enum: ["1"]}}
      responses:
        '200': {description: CSV export, content: {text/csv: {schema: {type: string}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/dashboard/summary:
    get:
      operationId: dashboardSummary
      summary: Counts and short lists the dashboard shows on landing (*:read)
      description: >-
        Experiment and test status counts, queued/running/failed analysis
        counts, analysis results by review status, how many animals filmed
        in a verified video still wait for a calibration of their arena that
        their paradigm requires, the 5 most recently published analysis
        results, and the 5 soonest planned sessions with their animals.
      responses:
        '200': {description: Summary, content: {application/json: {schema: {$ref: '#/components/schemas/DashboardSummary'}}}}
        '401': {$ref: '#/components/responses/Problem'}
components:
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    PageSize: {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 10}, description: Values above 100 are capped}
    SubstanceFilter: {name: substanceId, in: query, schema: {type: string, format: uuid}}
    From: {name: from, in: query, schema: {type: string, format: date-time}, description: Inclusive lower bound on administeredAt}
    To: {name: to, in: query, schema: {type: string, format: date-time}, description: Exclusive upper bound on administeredAt}
    ParadigmKey: {name: key, in: path, required: true, schema: {type: string, pattern: '^[A-Z_]+$'}, example: MWM}
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 token with issuer, audience and expiry; see backend/README.md
    worker:
      type: apiKey
      in: header
      name: Authorization
      description: '"Worker TOKEN" with the token returned when the worker was registered; accepted only on /api/worker routes'
  responses:
    Problem:
      description: Error with a stable code
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Session:
      description: Bearer token and the signed-in user
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [token, tokenType, expiresAt, user]
            properties:
              token: {type: string}
              tokenType: {type: string, enum: [Bearer]}
              expiresAt: {type: string, format: date-time}
              user:
                $ref: '#/components/schemas/User'
    User:
      description: User
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/User'
    Laboratory:
      description: Laboratory
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [name, code, timezone, createdAt, updatedAt]
            properties:
              name: {type: string}
              code: {type: [string, 'null']}
              timezone: {type: string}
              createdAt: {type: string, format: date-time}
              updatedAt: {type: string, format: date-time}
  schemas:
    Species: {type: string, enum: [MOUSE, RAT]}
    Sex: {type: string, enum: [FEMALE, MALE, UNKNOWN]}
    Code:
      type: string
      pattern: '^[A-Za-z0-9._/-]{1,64}$'
      description: Unique ignoring case
    Subject:
      type: object
      required: [id, code, species, sex, allocation, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        code: {$ref: '#/components/schemas/Code'}
        species: {$ref: '#/components/schemas/Species'}
        sex: {$ref: '#/components/schemas/Sex'}
        allocation:
          oneOf: [{$ref: '#/components/schemas/SubjectAllocation'}, {type: 'null'}]
          description: The group the animal belongs to, or null before it is allocated. Read-only; allocations are managed per experiment.
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    SubjectAllocation:
      type: object
      required: [experimentId, experimentCode, groupId, groupCode, groupRole, excluded]
      properties:
        experimentId: {type: string, format: uuid}
        experimentCode: {$ref: '#/components/schemas/Code'}
        groupId: {type: string, format: uuid}
        groupCode: {type: string}
        groupRole: {type: string, enum: [HEALTHY_CONTROL, SHAM, DISEASE_CONTROL, POSITIVE_CONTROL, TREATMENT]}
        excluded: {type: boolean, description: True once the animal was excluded from its study}
    SubjectInput:
      type: object
      additionalProperties: false
      required: [code, species, sex]
      properties:
        code: {$ref: '#/components/schemas/Code'}
        species: {$ref: '#/components/schemas/Species'}
        sex: {$ref: '#/components/schemas/Sex'}
    SubjectPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Omitted fields are unchanged
      properties:
        code: {$ref: '#/components/schemas/Code'}
        species: {$ref: '#/components/schemas/Species'}
        sex: {$ref: '#/components/schemas/Sex'}
    ExperimentStatus: {type: string, enum: [DRAFT, RUNNING, COMPLETED]}
    Experiment:
      type: object
      required: [id, code, title, description, hypothesis, randomisation, blinded, status, dayZero, startedAt, completedAt, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        code: {$ref: '#/components/schemas/Code'}
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: [string, 'null'], maxLength: 5000}
        hypothesis: {type: [string, 'null'], maxLength: 2000}
        randomisation: {type: [string, 'null'], maxLength: 500, description: How animals are randomised to groups}
        blinded: {type: boolean}
        status: {$ref: '#/components/schemas/ExperimentStatus'}
        dayZero: {type: [string, 'null'], format: date, description: Set when the experiment starts; study days count from it}
        startedAt: {type: [string, 'null'], format: date-time}
        completedAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ExperimentInput:
      type: object
      additionalProperties: false
      required: [code, title]
      properties:
        code: {$ref: '#/components/schemas/Code'}
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 5000}
        hypothesis: {type: string, maxLength: 2000}
        randomisation: {type: string, maxLength: 500}
        blinded: {type: boolean, default: false}
    ExperimentPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Omitted fields are unchanged; an empty description, hypothesis or randomisation clears it
      properties:
        code: {$ref: '#/components/schemas/Code'}
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 5000}
        hypothesis: {type: string, maxLength: 2000}
        randomisation: {type: string, maxLength: 500}
        blinded: {type: boolean}
    ReadinessProblem:
      type: object
      required: [rule, groupId, endpointId]
      properties:
        rule:
          type: string
          enum: [readiness.noTimepoints, readiness.noGroups, readiness.healthyControlMissing, readiness.targetSizeMissing,
                 readiness.primaryEndpointMissing,
                 readiness.endpointMetricUnavailable, readiness.treatmentItemMissing, readiness.treatmentItemNotAllowed,
                 readiness.inductionItemMissing, readiness.inductionItemNotAllowed, readiness.vehicleItemMissing,
                 readiness.diseaseControlMissing]
        groupId: {type: [string, 'null'], format: uuid, description: The group the rule is about}
        endpointId: {type: [string, 'null'], format: uuid, description: The endpoint the rule is about}
    Readiness:
      type: object
      description: >-
        Start rules: at least one timepoint and one group; at least one
        HEALTHY_CONTROL group, the reference every analysis compares against; every group has a
        target size; exactly one primary endpoint; every endpoint's metric is
        computed by a paradigm version of the protocol steps; TREATMENT and
        POSITIVE_CONTROL groups have one TREATMENT and an INDUCTION item;
        DISEASE_CONTROL has INDUCTION and VEHICLE items and no TREATMENT;
        SHAM has a VEHICLE item and no INDUCTION or TREATMENT; HEALTHY_CONTROL
        has no INDUCTION or TREATMENT; every SHAM, TREATMENT and
        POSITIVE_CONTROL group has a DISEASE_CONTROL group with the same
        disease model.
      required: [status, ready, unmet]
      properties:
        status: {$ref: '#/components/schemas/ExperimentStatus'}
        ready: {type: boolean}
        unmet: {type: array, items: {$ref: '#/components/schemas/ReadinessProblem'}}
    GroupRole: {type: string, enum: [HEALTHY_CONTROL, SHAM, DISEASE_CONTROL, POSITIVE_CONTROL, TREATMENT]}
    GroupCode: {type: string, pattern: '^[A-Za-z0-9._-]{1,16}$', description: Unique within the experiment ignoring case}
    Group:
      type: object
      required: [id, experimentId, code, name, role, diseaseModelId, targetSize, description, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        experimentId: {type: string, format: uuid}
        code: {$ref: '#/components/schemas/GroupCode'}
        name: {type: string, description: Unique within the experiment ignoring case}
        role: {$ref: '#/components/schemas/GroupRole'}
        diseaseModelId: {type: [string, 'null'], format: uuid, description: Null only for HEALTHY_CONTROL}
        targetSize: {type: [integer, 'null'], minimum: 1, maximum: 100000}
        description: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    GroupFill:
      allOf:
        - $ref: '#/components/schemas/Group'
        - type: object
          required: [allocated, excluded]
          properties:
            allocated: {type: integer, description: Allocated animals that are not excluded}
            excluded: {type: integer}
    GroupInput:
      type: object
      additionalProperties: false
      required: [code, name, role]
      properties:
        code: {$ref: '#/components/schemas/GroupCode'}
        name: {type: string, minLength: 1, maxLength: 120}
        role: {$ref: '#/components/schemas/GroupRole'}
        diseaseModelId: {type: string, format: uuid, description: Required unless the role is HEALTHY_CONTROL, forbidden then}
        targetSize: {type: integer, minimum: 0, maximum: 100000, description: 0 means no target}
        description: {type: string, maxLength: 5000}
    GroupPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Omitted fields are unchanged; an empty diseaseModelId or description clears it; targetSize 0 removes the target
      properties:
        code: {$ref: '#/components/schemas/GroupCode'}
        name: {type: string, minLength: 1, maxLength: 120}
        role: {$ref: '#/components/schemas/GroupRole'}
        diseaseModelId: {type: string}
        targetSize: {type: integer, minimum: 0, maximum: 100000}
        description: {type: string, maxLength: 5000}
    RegimenPurpose:
      type: string
      enum: [NONE, INDUCTION, VEHICLE, TREATMENT]
      description: NONE is a period in which a healthy control receives no substance; it has only a first and a last study day
    RegimenUnit: {type: string, enum: [mg/kg, ug/kg, mL/kg, IU/kg, mg, ug, g, mL, uL, IU]}
    RegimenRoute: {type: string, enum: [ORAL, INTRAPERITONEAL, SUBCUTANEOUS, INTRAVENOUS, INTRAMUSCULAR, INTRANASAL, INTRACEREBROVENTRICULAR, TOPICAL, INHALATION]}
    RegimenFrequency: {type: string, enum: [ONCE, DAILY, TWICE_DAILY, WEEKLY, EVERY_N_DAYS]}
    RegimenAmount: {type: string, pattern: '^[0-9]{1,9}(\.[0-9]{1,6})?$', description: Positive dose per administration, stored exactly}
    StudyDay: {type: integer, minimum: -365, maximum: 3650, description: Days relative to day 0}
    RegimenItem:
      type: object
      description: substanceId, amount, unit, route, frequency and intervalDays are null exactly for a NONE item and set otherwise (intervalDays only for EVERY_N_DAYS)
      required: [id, experimentId, groupId, purpose, substanceId, amount, unit, route, frequency, intervalDays, startDay, endDay, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        experimentId: {type: string, format: uuid}
        groupId: {type: string, format: uuid}
        purpose: {$ref: '#/components/schemas/RegimenPurpose'}
        substanceId: {type: [string, 'null'], format: uuid}
        amount: {oneOf: [{$ref: '#/components/schemas/RegimenAmount'}, {type: 'null'}]}
        unit: {oneOf: [{$ref: '#/components/schemas/RegimenUnit'}, {type: 'null'}]}
        route: {oneOf: [{$ref: '#/components/schemas/RegimenRoute'}, {type: 'null'}]}
        frequency: {oneOf: [{$ref: '#/components/schemas/RegimenFrequency'}, {type: 'null'}]}
        intervalDays: {type: [integer, 'null'], minimum: 2, maximum: 365, description: Set only for EVERY_N_DAYS}
        startDay: {$ref: '#/components/schemas/StudyDay'}
        endDay: {$ref: '#/components/schemas/StudyDay'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    RegimenItemInput:
      oneOf:
        - {$ref: '#/components/schemas/NoSubstancePeriodInput'}
        - {$ref: '#/components/schemas/SubstanceItemInput'}
      discriminator:
        propertyName: purpose
        mapping:
          NONE: '#/components/schemas/NoSubstancePeriodInput'
          INDUCTION: '#/components/schemas/SubstanceItemInput'
          VEHICLE: '#/components/schemas/SubstanceItemInput'
          TREATMENT: '#/components/schemas/SubstanceItemInput'
    NoSubstancePeriodInput:
      type: object
      additionalProperties: false
      required: [groupId, purpose, startDay, endDay]
      description: A healthy control's period without any substance; endDay is on or after startDay
      properties:
        groupId: {type: string, format: uuid}
        purpose: {type: string, const: NONE}
        startDay: {$ref: '#/components/schemas/StudyDay'}
        endDay: {$ref: '#/components/schemas/StudyDay'}
    SubstanceItemInput:
      type: object
      additionalProperties: false
      required: [groupId, purpose, substanceId, amount, unit, route, frequency, startDay, endDay]
      description: endDay is on or after startDay and equals it for ONCE
      properties:
        groupId: {type: string, format: uuid}
        purpose: {type: string, enum: [INDUCTION, VEHICLE, TREATMENT]}
        substanceId: {type: string, format: uuid}
        amount: {$ref: '#/components/schemas/RegimenAmount'}
        unit: {$ref: '#/components/schemas/RegimenUnit'}
        route: {$ref: '#/components/schemas/RegimenRoute'}
        frequency: {$ref: '#/components/schemas/RegimenFrequency'}
        intervalDays: {type: integer, minimum: 2, maximum: 365, description: Required for EVERY_N_DAYS, absent otherwise}
        startDay: {$ref: '#/components/schemas/StudyDay'}
        endDay: {$ref: '#/components/schemas/StudyDay'}
    RegimenItemPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Omitted fields are unchanged; intervalDays 0 removes the interval. With purpose NONE the item keeps only its days.
      properties:
        groupId: {type: string, format: uuid}
        purpose: {$ref: '#/components/schemas/RegimenPurpose'}
        substanceId: {type: string, format: uuid}
        amount: {$ref: '#/components/schemas/RegimenAmount'}
        unit: {$ref: '#/components/schemas/RegimenUnit'}
        route: {$ref: '#/components/schemas/RegimenRoute'}
        frequency: {$ref: '#/components/schemas/RegimenFrequency'}
        intervalDays: {type: integer, minimum: 0, maximum: 365}
        startDay: {$ref: '#/components/schemas/StudyDay'}
        endDay: {$ref: '#/components/schemas/StudyDay'}
    Timepoint:
      type: object
      required: [id, experimentId, name, studyDay, position, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        experimentId: {type: string, format: uuid}
        name: {type: string, description: Unique within the experiment ignoring case}
        studyDay: {$ref: '#/components/schemas/StudyDay'}
        position: {type: integer, minimum: 1, maximum: 1000, description: Unique within the experiment}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    TimepointInput:
      type: object
      additionalProperties: false
      required: [name, studyDay, position]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        studyDay: {$ref: '#/components/schemas/StudyDay'}
        position: {type: integer, minimum: 1, maximum: 1000}
    TimepointPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        studyDay: {$ref: '#/components/schemas/StudyDay'}
        position: {type: integer, minimum: 1, maximum: 1000}
    EndpointKind: {type: string, enum: [PRIMARY, SECONDARY]}
    EndpointDirection: {type: string, enum: [HIGHER_IS_BETTER, LOWER_IS_BETTER]}
    Endpoint:
      type: object
      required: [id, experimentId, timepointId, baselineTimepointId, paradigmKey, metricKey, kind, direction, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        experimentId: {type: string, format: uuid}
        timepointId: {type: string, format: uuid}
        baselineTimepointId: {type: [string, 'null'], format: uuid, description: Report change from this timepoint per animal}
        paradigmKey: {type: string, pattern: '^[A-Z][A-Z_]{0,39}$'}
        metricKey: {type: string, pattern: '^[a-z][a-z0-9_]{0,79}$'}
        kind: {$ref: '#/components/schemas/EndpointKind'}
        direction: {$ref: '#/components/schemas/EndpointDirection'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    EndpointInput:
      type: object
      additionalProperties: false
      required: [timepointId, paradigmKey, metricKey, kind, direction]
      properties:
        timepointId: {type: string, format: uuid}
        baselineTimepointId: {type: string, format: uuid, description: Another timepoint of this experiment}
        paradigmKey: {type: string, pattern: '^[A-Z][A-Z_]{0,39}$'}
        metricKey: {type: string, pattern: '^[a-z][a-z0-9_]{0,79}$'}
        kind: {$ref: '#/components/schemas/EndpointKind'}
        direction: {$ref: '#/components/schemas/EndpointDirection'}
    EndpointPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Omitted fields are unchanged; an empty baselineTimepointId clears it
      properties:
        timepointId: {type: string, format: uuid}
        baselineTimepointId: {type: string}
        paradigmKey: {type: string, pattern: '^[A-Z][A-Z_]{0,39}$'}
        metricKey: {type: string, pattern: '^[a-z][a-z0-9_]{0,79}$'}
        kind: {$ref: '#/components/schemas/EndpointKind'}
        direction: {$ref: '#/components/schemas/EndpointDirection'}
    ExclusionReason: {type: string, enum: [DIED, HUMANE_ENDPOINT, INDUCTION_FAILED, TECHNICAL, OTHER]}
    Allocation:
      type: object
      required: [id, experimentId, groupId, subjectId, allocatedAt, cage, excluded, excludedAt, exclusionReason, exclusionNote, createdBy, createdAt]
      properties:
        id: {type: string, format: uuid}
        experimentId: {type: string, format: uuid}
        groupId: {type: string, format: uuid}
        subjectId: {type: string, format: uuid}
        subjectCode: {type: string, description: Present in lists}
        allocatedAt: {type: string, format: date-time}
        cage: {type: [string, 'null'], maxLength: 32}
        excluded: {type: boolean}
        excludedAt: {type: [string, 'null'], format: date-time}
        exclusionReason: {oneOf: [{$ref: '#/components/schemas/ExclusionReason'}, {type: 'null'}]}
        exclusionNote: {type: [string, 'null'], maxLength: 2000}
        createdBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
    AllocationInput:
      type: object
      additionalProperties: false
      required: [subjectId, groupId]
      properties:
        subjectId: {type: string, format: uuid}
        groupId: {type: string, format: uuid}
        cage: {type: string, minLength: 1, maxLength: 32}
        allocatedAt: {type: string, format: date-time, description: Defaults to now; not in the future}
    SubstanceKind:
      type: string
      enum: [COMPOUND, REFERENCE_DRUG, VEHICLE, INDUCER]
      description: Guides pickers only; the role of a substance in a study comes from the regimen item that uses it
    Substance:
      type: object
      required: [id, name, kind, description, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, description: Unique ignoring case}
        kind: {$ref: '#/components/schemas/SubstanceKind'}
        description: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    SubstanceInput:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        kind: {$ref: '#/components/schemas/SubstanceKind'}
        description: {type: string, maxLength: 5000}
    SubstancePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Omitted fields are unchanged; an empty description clears it
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        kind: {$ref: '#/components/schemas/SubstanceKind'}
        description: {type: string, maxLength: 5000}
    InductionType:
      type: string
      enum: [CHEMICAL, SURGICAL, DIET, STRESS, OTHER]
    DiseaseModel:
      type: object
      required: [id, name, inductionType, confirmationCriterion, description, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, description: Unique ignoring case}
        inductionType: {$ref: '#/components/schemas/InductionType'}
        confirmationCriterion: {type: [string, 'null'], description: 'How the model is confirmed, e.g. "pole descent time > 150% of baseline"'}
        description: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    DiseaseModelInput:
      type: object
      additionalProperties: false
      required: [name, inductionType]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        inductionType: {$ref: '#/components/schemas/InductionType'}
        confirmationCriterion: {type: string, maxLength: 2000}
        description: {type: string, maxLength: 5000}
    DiseaseModelPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Omitted fields are unchanged; an empty criterion or description clears it
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        inductionType: {$ref: '#/components/schemas/InductionType'}
        confirmationCriterion: {type: string, maxLength: 2000}
        description: {type: string, maxLength: 5000}
    CatalogEntry:
      type: object
      required: [id, name, description, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, description: Unique ignoring case}
        description: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CatalogList:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/CatalogEntry'}}
    CatalogInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 5000}
    CatalogPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 5000, description: Empty clears it}
    Amount:
      type: string
      pattern: '^[0-9]{1,9}(\.[0-9]{1,6})?$'
      description: Positive decimal, stored exactly
    DoseUnit:
      type: string
      enum: [mg, ug, g, mL, uL, IU, mg/kg, ug/kg, mL/kg, IU/kg]
    AdministrationRoute:
      type: string
      enum: [ORAL, INTRAPERITONEAL, SUBCUTANEOUS, INTRAVENOUS, INTRAMUSCULAR, INTRANASAL, INTRACEREBROVENTRICULAR, TOPICAL, INHALATION]
    Dose:
      type: object
      required: [amount, unit]
      properties:
        amount: {$ref: '#/components/schemas/Amount'}
        unit: {$ref: '#/components/schemas/DoseUnit'}
    WeightMeasurement:
      type: object
      required: [id, subjectId, grams, measuredAt, recordedBy, createdAt]
      properties:
        id: {type: string, format: uuid}
        subjectId: {type: string, format: uuid}
        grams: {type: string, description: Up to 3 decimals}
        measuredAt: {type: string, format: date-time}
        recordedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
    WeightInput:
      type: object
      additionalProperties: false
      required: [grams, measuredAt]
      properties:
        grams: {type: string, pattern: '^[0-9]{1,4}(\.[0-9]{1,3})?$', description: Between 0.001 and 5000}
        measuredAt: {type: string, format: date-time, description: Not in the future}
    DosePurpose:
      type: string
      enum: [INDUCTION, VEHICLE, TREATMENT]
    DoseFrequency:
      type: string
      enum: [ONCE, DAILY, TWICE_DAILY, WEEKLY, EVERY_N_DAYS]
    Administration:
      type: object
      required: [id, experimentId, allocationId, groupId, subjectId, regimenItemId, purpose, substanceId, substanceName, dose, absoluteDose,
        route, weightMeasurementId, bodyWeightGrams, administeredAt, notes, recordedBy, createdAt]
      properties:
        id: {type: string, format: uuid}
        experimentId: {type: string, format: uuid}
        allocationId: {type: string, format: uuid}
        groupId: {type: string, format: uuid}
        subjectId: {type: string, format: uuid}
        regimenItemId: {type: [string, 'null'], format: uuid, description: Null for an unplanned dose}
        purpose: {$ref: '#/components/schemas/DosePurpose'}
        substanceId: {type: string, format: uuid}
        substanceName: {type: string, description: Current catalog name}
        dose: {$ref: '#/components/schemas/Dose'}
        absoluteDose:
          description: Amount given, the dose multiplied by body mass for per-kilogram units and rounded half up to 6 decimals; equal to dose otherwise
          oneOf:
            - $ref: '#/components/schemas/Dose'
            - type: 'null'
        route: {$ref: '#/components/schemas/AdministrationRoute'}
        weightMeasurementId: {type: [string, 'null'], format: uuid}
        bodyWeightGrams: {type: [string, 'null'], description: Weight the dose was computed from}
        administeredAt: {type: string, format: date-time}
        notes: {type: [string, 'null']}
        recordedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
    AdministrationInput:
      type: object
      additionalProperties: false
      required: [administeredAt]
      description: Either regimenItemId, or purpose, substanceId, amount, unit and route
      properties:
        regimenItemId: {type: string, format: uuid, description: Planned item of the animal's group}
        purpose: {$ref: '#/components/schemas/DosePurpose'}
        substanceId: {type: string, format: uuid, description: For a planned dose it must be the item's substance}
        amount: {$ref: '#/components/schemas/Amount'}
        unit: {$ref: '#/components/schemas/DoseUnit'}
        route: {$ref: '#/components/schemas/AdministrationRoute'}
        weightMeasurementId: {type: string, format: uuid, description: Same animal, measured within the 7 days before; defaults to the latest weight for per-kilogram units}
        administeredAt: {type: string, format: date-time, description: Not before allocation, not at or after exclusion, not in the future}
        notes: {type: string, maxLength: 2000}
    AdministrationPage:
      type: object
      required: [data, total, page, pageSize]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Administration'}}
        total: {type: integer}
        page: {type: integer}
        pageSize: {type: integer}
    DueDose:
      type: object
      required: [regimenItemId, purpose, substanceId, substanceName, dose, absoluteDose, route, frequency, due, given, complete]
      properties:
        regimenItemId: {type: string, format: uuid}
        purpose: {$ref: '#/components/schemas/DosePurpose'}
        substanceId: {type: string, format: uuid}
        substanceName: {type: string}
        dose: {$ref: '#/components/schemas/Dose'}
        absoluteDose:
          description: Amount to give for the animal's latest weight; null for a per-kilogram dose of an animal never weighed
          oneOf:
            - $ref: '#/components/schemas/Dose'
            - type: 'null'
        route: {$ref: '#/components/schemas/AdministrationRoute'}
        frequency: {$ref: '#/components/schemas/DoseFrequency'}
        due: {type: integer, description: Doses due that day, 2 for TWICE_DAILY}
        given: {type: integer, description: Doses of this item recorded that day}
        complete: {type: boolean}
    DueAnimal:
      type: object
      required: [allocationId, subjectId, subjectCode, groupId, groupCode, cage, excluded, weight, doses]
      properties:
        allocationId: {type: string, format: uuid}
        subjectId: {type: string, format: uuid}
        subjectCode: {type: string}
        groupId: {type: string, format: uuid}
        groupCode: {type: string}
        cage: {type: [string, 'null']}
        excluded: {type: boolean, description: Excluded during that day}
        weight:
          description: Latest weight measured by the end of that day
          oneOf:
            - type: object
              required: [id, grams, measuredAt]
              properties:
                id: {type: string, format: uuid}
                grams: {type: string}
                measuredAt: {type: string, format: date-time}
            - type: 'null'
        doses: {type: array, items: {$ref: '#/components/schemas/DueDose'}}
    DosingSchedule:
      type: object
      required: [experimentId, date, studyDay, animals]
      properties:
        experimentId: {type: string, format: uuid}
        date: {type: string, format: date}
        studyDay: {type: integer, description: Days from day 0; day 0 is 0 and the day before it -1}
        animals: {type: array, items: {$ref: '#/components/schemas/DueAnimal'}, description: Ordered by group code and animal code}
    InductionOutcomeStatus:
      type: string
      enum: [CONFIRMED, NOT_CONFIRMED]
    InductionOutcome:
      type: object
      required: [allocationId, experimentId, status, assessedAt, note, recordedBy, createdAt]
      properties:
        allocationId: {type: string, format: uuid}
        experimentId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/InductionOutcomeStatus'}
        assessedAt: {type: string, format: date-time}
        note: {type: [string, 'null']}
        recordedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
    InductionOutcomeRow:
      allOf:
        - $ref: '#/components/schemas/InductionOutcome'
        - type: object
          required: [subjectId, subjectCode, groupId, groupCode]
          properties:
            subjectId: {type: string, format: uuid}
            subjectCode: {type: string}
            groupId: {type: string, format: uuid}
            groupCode: {type: string}
    InductionOutcomeInput:
      type: object
      additionalProperties: false
      required: [status, assessedAt]
      properties:
        status: {$ref: '#/components/schemas/InductionOutcomeStatus'}
        assessedAt: {type: string, format: date-time, description: Not before allocation, not at or after exclusion, not in the future}
        note: {type: string, maxLength: 2000}
    ParadigmSummary:
      type: object
      required: [key, name, description, category, species, versions, latestVersion]
      properties:
        key: {type: string}
        name: {type: string, description: In the response language}
        description: {type: string, description: What the test is and what it measures, in the response language}
        category: {type: string, enum: [LEARNING_MEMORY, MOTOR]}
        species: {type: array, items: {type: string}}
        versions: {type: array, items: {type: integer}}
        latestVersion: {type: integer}
    ParadigmParameter:
      type: object
      required: [key, scope, label, help, unit, valueType, min, max, default]
      properties:
        key: {type: string}
        scope:
          type: string
          enum: [APPARATUS, ANALYSIS, SESSION]
          description: APPARATUS values are measured and required on an environment; ANALYSIS values are optional on an environment; SESSION values are optional on a protocol step. Missing optional values use the default
        label: {type: string, description: In the response language}
        help: {type: string, description: What to measure or what the value changes, in the response language}
        unit: {type: string, enum: [cm, cm_s, s, count, ratio, boolean]}
        valueType: {type: string, enum: [number, integer], description: Integer parameters accept whole numbers only; booleans are 0 or 1}
        min: {type: number}
        max: {type: number}
        default: {type: number}
    ParadigmMetric:
      type: object
      required: [key, label, description, unit, valueType, definition, formula, missingWhen, inputs, min, max, tolerance]
      properties:
        key: {type: string}
        label: {type: string, description: In the response language}
        description: {type: string, description: Plain explanation in the response language}
        unit: {type: string, enum: [cm, cm_s, s, count, ratio, boolean]}
        valueType: {type: string, enum: [number, integer]}
        definition: {type: string, description: Precise technical definition in the response language}
        formula: {type: string, description: Expression; the same in every language}
        missingWhen: {type: string, description: When the metric is reported missing instead of a value, in the response language}
        inputs: {type: array, items: {type: string}}
        min: {type: number}
        max: {type: number}
        tolerance: {type: number, description: Absolute tolerance in the metric unit}
    ParadigmEvent:
      type: object
      required: [type, label, kind, labels, single, definition]
      properties:
        type: {type: string}
        label: {type: string, description: In the response language}
        kind: {type: string, enum: [INTERVAL, POINT]}
        labels: {type: array, items: {type: string}, description: 'Labels every event of the type carries (NOVEL_OBJECT exploration: novel, familiar); empty when the event takes no label'}
        single: {type: boolean, description: The event may occur at most once per trial}
        definition: {type: string}
    ParadigmManifest:
      type: object
      required: [key, name, description, category, species, trialTypes, version, metricEngineVersion, resultSchemaVersion, parameters, zones, inputEvents, events, metrics, qc]
      properties:
        key: {type: string}
        name: {type: string}
        description: {type: string}
        category: {type: string}
        species: {type: array, items: {type: string}}
        trialTypes: {type: array, items: {type: object, required: [key, label], properties: {key: {type: string}, label: {type: string}}}}
        version: {type: integer, description: ParadigmVersion; a published version never changes}
        metricEngineVersion: {type: integer}
        resultSchemaVersion: {type: integer}
        parameters: {type: array, description: Ordered apparatus, analysis, then session, items: {$ref: '#/components/schemas/ParadigmParameter'}}
        zones:
          type: array
          items:
            type: object
            required: [key, label, role, geometry, calibrated, required]
            properties:
              key: {type: string}
              label: {type: string}
              role: {type: string}
              geometry: {type: string}
              calibrated: {type: boolean, description: Shapes come with the analysis input (per-video calibration) instead of being derived from parameters}
              required: {type: boolean}
        inputEvents:
          type: array
          description: Always empty; every paradigm derives its events from the tracked trajectory and calibrated zones. Kept so published manifests never change.
          items: {$ref: '#/components/schemas/ParadigmEvent'}
        events:
          type: array
          description: Intervals and points the metric engine derives
          items: {$ref: '#/components/schemas/ParadigmEvent'}
        metrics: {type: array, items: {$ref: '#/components/schemas/ParadigmMetric'}}
        qc:
          type: array
          items: {type: object, required: [key, operator, value, unit], properties: {key: {type: string}, operator: {type: string}, value: {type: number}, unit: {type: string}}}
    ParameterValues:
      type: object
      additionalProperties: {type: number}
      description: Parameter values by key, in the units of the paradigm manifest
    ConstantKey: {type: string, pattern: '^[A-Z][A-Z_]{0,39}$'}
    Environment:
      type: object
      required: [id, name, paradigmKey, notes, latestRevision, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        paradigmKey: {$ref: '#/components/schemas/ConstantKey'}
        notes: {type: [string, 'null']}
        latestRevision: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    EnvironmentRevision:
      type: object
      required: [id, environmentId, number, paradigmKey, paradigmVersion, parameters, notes, createdBy, createdAt]
      description: Immutable apparatus measurements and analysis settings validated against one paradigm version
      properties:
        id: {type: string, format: uuid}
        environmentId: {type: string, format: uuid}
        number: {type: integer, minimum: 1}
        paradigmKey: {$ref: '#/components/schemas/ConstantKey'}
        paradigmVersion: {type: integer, minimum: 1}
        parameters:
          allOf: [{$ref: '#/components/schemas/ParameterValues'}]
          description: APPARATUS and ANALYSIS values as given; omitted analysis values take their defaults when used
        notes: {type: [string, 'null']}
        createdBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
    EnvironmentRevisionSummary:
      type: object
      required: [id, environmentId, environmentName, paradigmKey, number, paradigmVersion]
      properties:
        id: {type: string, format: uuid}
        environmentId: {type: string, format: uuid}
        environmentName: {type: string}
        paradigmKey: {$ref: '#/components/schemas/ConstantKey'}
        number: {type: integer, minimum: 1}
        paradigmVersion: {type: integer, minimum: 1}
    EnvironmentRevisionInput:
      type: object
      additionalProperties: false
      required: [paradigmVersion, parameters]
      properties:
        paradigmVersion: {type: integer, minimum: 1}
        parameters:
          allOf: [{$ref: '#/components/schemas/ParameterValues'}]
          description: Every APPARATUS parameter of the paradigm version, within range and consistent (no measurement is defaulted), plus any ANALYSIS parameters; omitted analysis values take their defaults
        notes: {type: string, maxLength: 2000}
    EnvironmentInput:
      type: object
      additionalProperties: false
      required: [name, paradigmKey, revision]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        paradigmKey: {$ref: '#/components/schemas/ConstantKey'}
        notes: {type: string, maxLength: 2000}
        revision: {$ref: '#/components/schemas/EnvironmentRevisionInput'}
    EnvironmentPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: An empty notes value clears the notes
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        notes: {type: string, maxLength: 2000}
    Protocol:
      type: object
      required: [id, experimentId, name, description, latestVersion, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        experimentId: {type: string, format: uuid}
        name: {type: string}
        description: {type: [string, 'null']}
        latestVersion: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ProtocolStep:
      type: object
      required: [position, paradigmKey, paradigmVersion, trialType, trials, interTrialIntervalS, session, notes]
      description: The arena is chosen per animal when a test is planned
      properties:
        position: {type: integer, minimum: 1, maximum: 50}
        paradigmKey: {$ref: '#/components/schemas/ConstantKey'}
        paradigmVersion: {type: integer, minimum: 1}
        trialType: {$ref: '#/components/schemas/ConstantKey'}
        trials: {type: integer, minimum: 1, maximum: 1000}
        interTrialIntervalS: {type: integer, minimum: 0, maximum: 86400}
        session:
          allOf: [{$ref: '#/components/schemas/ParameterValues'}]
          description: Every session parameter of the paradigm version, with defaults filled in
        notes: {type: [string, 'null']}
    ProtocolStepInput:
      type: object
      additionalProperties: false
      required: [position, paradigmKey, paradigmVersion, trialType, trials]
      properties:
        position: {type: integer, minimum: 1, maximum: 50, description: Positions run from 1 without gaps or duplicates}
        paradigmKey: {$ref: '#/components/schemas/ConstantKey'}
        paradigmVersion: {type: integer, minimum: 1}
        trialType: {$ref: '#/components/schemas/ConstantKey'}
        trials: {type: integer, minimum: 1, maximum: 1000}
        interTrialIntervalS: {type: integer, minimum: 0, maximum: 86400, default: 0}
        session:
          allOf: [{$ref: '#/components/schemas/ParameterValues'}]
          description: SESSION parameters of the paradigm version, checked against its ranges and rules; omitted ones take their defaults. Apparatus and analysis keys are rejected
        notes: {type: string, maxLength: 2000}
    ProtocolVersion:
      type: object
      required: [id, experimentId, protocolId, number, notes, createdBy, createdAt, steps]
      description: Immutable; tests reference a fixed version
      properties:
        id: {type: string, format: uuid}
        experimentId: {type: string, format: uuid}
        protocolId: {type: string, format: uuid}
        number: {type: integer, minimum: 1}
        notes: {type: [string, 'null']}
        createdBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        steps: {type: array, items: {$ref: '#/components/schemas/ProtocolStep'}}
    ProtocolVersionInput:
      type: object
      additionalProperties: false
      required: [steps]
      properties:
        notes: {type: string, maxLength: 2000}
        steps: {type: array, minItems: 1, maxItems: 50, items: {$ref: '#/components/schemas/ProtocolStepInput'}}
    ProtocolInput:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 5000}
        version: {$ref: '#/components/schemas/ProtocolVersionInput'}
    ProtocolPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: An empty description clears it
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 5000}
    TestStatus: {type: string, enum: [PLANNED, IN_PROGRESS, COMPLETED, CANCELLED]}
    Test:
      type: object
      required: [id, experimentId, experimentCode, timepointId, timepointName, studyDay, protocolId, protocolName, protocolVersionId, protocolVersion, stepPosition, paradigmKey, paradigmVersion, plannedTrials, status, scheduledAt, startedAt, completedAt, cancelledAt, cancelReason, notes, createdBy, createdAt, updatedAt, subjects]
      description: One session of a running experiment at one timepoint on one protocol step, with one video and one or more animals each in its own arena. Context fields never change; status is the session's own lifecycle, separate from analysis.
      properties:
        id: {type: string, format: uuid}
        experimentId: {type: string, format: uuid}
        experimentCode: {type: string}
        timepointId: {type: string, format: uuid}
        timepointName: {type: string}
        studyDay: {type: integer}
        protocolId: {type: string, format: uuid}
        protocolName: {type: string}
        protocolVersionId: {type: string, format: uuid}
        protocolVersion: {type: integer, minimum: 1}
        stepPosition: {type: integer, minimum: 1}
        paradigmKey: {$ref: '#/components/schemas/ConstantKey'}
        paradigmVersion: {type: integer, minimum: 1}
        plannedTrials: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/TestStatus'}
        scheduledAt: {type: string, format: date-time}
        startedAt: {type: [string, 'null'], format: date-time}
        completedAt: {type: [string, 'null'], format: date-time}
        cancelledAt: {type: [string, 'null'], format: date-time}
        cancelReason: {type: [string, 'null']}
        notes: {type: [string, 'null']}
        createdBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        subjects: {type: array, items: {$ref: '#/components/schemas/TestSubject'}}
    TestSubject:
      type: object
      required: [id, allocationId, subjectId, subjectCode, excluded, environmentRevisionId, environmentId, environmentName, environmentRevision, createdBy, createdAt]
      description: One animal of a test in its arena. The group is left out so a blinded study stays blind for the people running tests.
      properties:
        id: {type: string, format: uuid}
        allocationId: {type: string, format: uuid}
        subjectId: {type: string, format: uuid}
        subjectCode: {type: string}
        excluded: {type: boolean, description: The animal was excluded from the study after it was planned}
        environmentRevisionId: {type: string, format: uuid}
        environmentId: {type: string, format: uuid}
        environmentName: {type: string}
        environmentRevision: {type: integer, minimum: 1}
        createdBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        trials: {type: array, items: {$ref: '#/components/schemas/Trial'}, description: 'Only on GET /api/tests/{id}'}
    TestSubjectInput:
      type: object
      additionalProperties: false
      required: [allocationId, environmentRevisionId]
      properties:
        allocationId: {type: string, format: uuid, description: An allocation of this experiment that is not excluded}
        environmentRevisionId: {type: string, format: uuid, description: An environment revision of the step's paradigm version, not used by another animal of the test}
    TestInput:
      type: object
      additionalProperties: false
      required: [timepointId, protocolVersionId, stepPosition, subjects]
      properties:
        timepointId: {type: string, format: uuid, description: A timepoint of this experiment}
        protocolVersionId: {type: string, format: uuid, description: A protocol version of this experiment}
        stepPosition: {type: integer, minimum: 1}
        scheduledAt: {type: string, format: date-time, description: Defaults to day 0 plus the timepoint's study day, at midnight in the laboratory's time zone}
        notes: {type: string, maxLength: 2000}
        subjects: {type: array, minItems: 1, maxItems: 12, items: {$ref: '#/components/schemas/TestSubjectInput'}}
    Trial:
      type: object
      required: [id, testId, testSubjectId, number, repetition, attempt, startedAt, endedAt, notes, recordedBy, createdAt]
      description: Immutable; a repeated repetition is a new attempt
      properties:
        id: {type: string, format: uuid}
        testId: {type: string, format: uuid}
        testSubjectId: {type: string, format: uuid}
        number: {type: integer, minimum: 1, description: Recording order within the animal's trials}
        repetition: {type: integer, minimum: 1}
        attempt: {type: integer, minimum: 1}
        startedAt: {type: string, format: date-time}
        endedAt: {type: [string, 'null'], format: date-time}
        notes: {type: [string, 'null']}
        recordedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
    TrialInput:
      type: object
      additionalProperties: false
      required: [repetition, startedAt]
      properties:
        repetition: {type: integer, minimum: 1, description: At most the planned trials of the step}
        startedAt: {type: string, format: date-time, description: Not before the test started}
        endedAt: {type: string, format: date-time, description: After startedAt}
        notes: {type: string, maxLength: 2000}
    Comment:
      type: object
      required: [id, testId, authorId, authorName, body, edited, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        testId: {type: string, format: uuid}
        authorId: {type: string, format: uuid}
        authorName: {type: [string, 'null'], description: Null once the author's account is deleted}
        body: {type: string, description: Plain text; render it escaped}
        edited: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CommentInput:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: {type: string, minLength: 1, maxLength: 2000, description: Control characters other than tab and line breaks are removed before the length check}
    Video:
      type: object
      required: [id, kind, contentType, fileName, sizeBytes, crc32c, status, generation, rejectionReason, verifiedAt, createdBy, createdAt]
      description: A video object in private Cloud Storage. Verified videos never change.
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [ORIGINAL, ANALYZED]}
        contentType: {type: string, enum: [video/mp4, video/quicktime, video/webm]}
        fileName: {type: [string, 'null']}
        sizeBytes: {type: integer, format: int64}
        crc32c: {type: string, description: Base64 of the big-endian CRC32C}
        status: {type: string, enum: [PENDING, VERIFIED, REJECTED]}
        generation: {type: [string, 'null'], description: Cloud Storage object generation as a decimal string}
        rejectionReason: {type: [string, 'null'], enum: [OVERSIZED, SIZE_MISMATCH, CHECKSUM_MISMATCH, CONTENT_TYPE_MISMATCH, null]}
        verifiedAt: {type: [string, 'null'], format: date-time}
        createdBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
    Recording:
      type: object
      required: [id, experimentId, testId, supersedesId, current, clipStartUs, clipEndUs, video, createdBy, createdAt]
      description: One video of a test. Recordings never change; a replacement supersedes the current one.
      properties:
        id: {type: string, format: uuid}
        experimentId: {type: string, format: uuid}
        testId: {type: string, format: uuid}
        supersedesId: {type: [string, 'null'], format: uuid, description: The recording this one replaced; null for the first video of the test}
        current: {type: boolean, description: True for the one recording of the test nothing supersedes}
        clipStartUs: {type: integer, format: int64, minimum: 0, description: Microseconds from the start of the video}
        clipEndUs: {type: [integer, 'null'], format: int64, description: Null runs to the end of the video}
        video: {$ref: '#/components/schemas/Video'}
        createdBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
    RecordingUploadInput:
      type: object
      additionalProperties: false
      required: [fileName, contentType, sizeBytes, crc32c]
      properties:
        fileName: {type: string, minLength: 1, maxLength: 255}
        contentType: {type: string, enum: [video/mp4, video/quicktime, video/webm]}
        sizeBytes: {type: integer, format: int64, minimum: 1, description: At most VIDEO_MAX_BYTES}
        crc32c: {type: string, description: Base64 of the big-endian CRC32C of the whole file}
        clipStartUs: {type: integer, format: int64, minimum: 0, default: 0}
        clipEndUs: {type: integer, format: int64}
    SignedUpload:
      type: object
      required: [method, url, headers, expiresAt]
      description: A signed request that starts a resumable upload; it fails if the object already exists
      properties:
        method: {type: string, enum: [POST]}
        url: {type: string, format: uri}
        headers: {type: object, additionalProperties: {type: string}, description: 'Send all of them: Content-Type, x-goog-resumable, x-goog-if-generation-match and, for a video, x-goog-content-length-range "0,<sizeBytes>"'}
        expiresAt: {type: string, format: date-time}
    CalibrationPoint:
      type: object
      additionalProperties: false
      required: [pixelX, pixelY, worldX, worldY]
      properties:
        pixelX: {type: number, description: Full-frame pixel column}
        pixelY: {type: number, description: Full-frame pixel row}
        worldX: {type: number, description: Centimeters on the measurement plane}
        worldY: {type: number}
    CalibrationCrop:
      type: object
      additionalProperties: false
      required: [x, y, width, height]
      properties:
        x: {type: integer, minimum: 0}
        y: {type: integer, minimum: 0}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
    EnvironmentCalibrationInput:
      type: object
      additionalProperties: false
      required: [cameraId, frameWidth, frameHeight, crop, measurementPlane, fitPoints, checkPoints]
      description: A calibration input without a video
      properties:
        cameraId: {type: string, minLength: 1, maxLength: 120}
        frameWidth: {type: integer, minimum: 1, maximum: 16384}
        frameHeight: {type: integer, minimum: 1, maximum: 16384}
        crop: {$ref: '#/components/schemas/CalibrationCrop'}
        referenceFrameUs: {type: integer, format: int64, minimum: 0, description: Ignored; an environment has no video}
        measurementPlane: {type: string, enum: [ARENA_FLOOR, WATER_SURFACE, APPARATUS_TOP, APPARATUS_SIDE]}
        fitPoints: {type: array, minItems: 4, maxItems: 100, items: {$ref: '#/components/schemas/CalibrationPoint'}, description: Inside the crop, no three on a line, inside the environment revision}
        checkPoints: {type: array, minItems: 3, maxItems: 100, items: {$ref: '#/components/schemas/CalibrationPoint'}, description: Independent of the FIT points (at least 1 pixel away)}
        supersedesId: {type: string, format: uuid, description: The latest calibration of the revision; required for corrections}
        zones:
          type: array
          maxItems: 1000
          items: {$ref: '#/components/schemas/CalibrationZoneInput'}
          description: 'Shapes of the paradigm''s calibrated zones in full-frame pixels, required for paradigms with calibrated zones (NOVEL_OBJECT, POLE and TREADMILL): keys must be calibrated zones of the paradigm version (400 calibration.unknownZone), every required one needs a shape (calibration.missingZone), shapes are a circle with a positive radius or a polygon of 3 to 100 vertices, at most 100 per key (calibration.invalidZone), inside the frame (calibration.zoneOutsideFrame). They are converted to centimetres with the fitted transform and stored with the calibration.'
    CalibrationStatus:
      type: object
      required: [status, source, drift, calibration]
      properties:
        status: {type: string, enum: [NOT_REQUIRED, WAITING_FOR_VIDEO, WAITING_FOR_CALIBRATION, CALIBRATED], description: 'WAITING_FOR_VIDEO (test subjects and trials) while there is no current verified video; WAITING_FOR_CALIBRATION until a VALID calibration applies that has a shape for every required calibrated zone of the paradigm'}
        source: {type: [string, 'null'], enum: [ENVIRONMENT, OVERRIDE, TRIAL, null], description: Which calibration decides. OVERRIDE (or TRIAL) with WAITING_FOR_CALIBRATION means the animal's override (or the trial's calibration) on the current video was rejected. Null when nothing was calibrated}
        drift: {type: [string, 'null'], enum: [UNCHECKED, null], description: Whether camera or arena movement was checked. No check exists yet, so a calibration in use is UNCHECKED; null while waiting}
        calibration: {oneOf: [{$ref: '#/components/schemas/Calibration'}, {type: 'null'}]}
    SubjectCalibrationStatus:
      description: The calibration state of one animal of a test on the test's current video
      allOf:
        - $ref: '#/components/schemas/CalibrationStatus'
        - type: object
          required: [testSubjectId, environmentRevisionId, recordingId]
          properties:
            testSubjectId: {type: string, format: uuid}
            environmentRevisionId: {type: string, format: uuid, description: The animal's arena}
            recordingId: {type: [string, 'null'], format: uuid, description: The test's current video; null while it has none}
    CalibrationInput:
      type: object
      additionalProperties: false
      required: [cameraId, frameWidth, frameHeight, crop, referenceFrameUs, measurementPlane, fitPoints, checkPoints]
      properties:
        cameraId: {type: string, minLength: 1, maxLength: 120}
        frameWidth: {type: integer, minimum: 1, maximum: 16384}
        frameHeight: {type: integer, minimum: 1, maximum: 16384}
        crop: {$ref: '#/components/schemas/CalibrationCrop'}
        referenceFrameUs: {type: integer, format: int64, minimum: 0, description: Video time of the frame the points were read from}
        measurementPlane: {type: string, enum: [ARENA_FLOOR, WATER_SURFACE, APPARATUS_TOP, APPARATUS_SIDE]}
        fitPoints: {type: array, minItems: 4, maxItems: 100, items: {$ref: '#/components/schemas/CalibrationPoint'}, description: Inside the crop, no three on a line; inside the environment when the paradigm derives its zones from parameters}
        checkPoints: {type: array, minItems: 3, maxItems: 100, items: {$ref: '#/components/schemas/CalibrationPoint'}, description: Independent of the FIT points (at least 1 pixel away)}
        supersedesId: {type: string, format: uuid, description: The latest override of the animal over all videos of the test; required for corrections}
        zones:
          type: array
          maxItems: 1000
          items: {$ref: '#/components/schemas/CalibrationZoneInput'}
          description: 'Shapes of the paradigm''s calibrated zones in full-frame pixels, required for paradigms with calibrated zones (NOVEL_OBJECT, POLE and TREADMILL): keys must be calibrated zones of the paradigm version (400 calibration.unknownZone), every required one needs a shape (calibration.missingZone), shapes are a circle with a positive radius or a polygon of 3 to 100 vertices, at most 100 per key (calibration.invalidZone), inside the frame (calibration.zoneOutsideFrame). They are converted to centimetres with the fitted transform and stored with the calibration.'
    ZoneVertex:
      type: object
      additionalProperties: false
      required: [x, y]
      properties:
        x: {type: number}
        y: {type: number}
    ZoneShape:
      description: A circle or a polygon; exactly one of them is present
      oneOf:
        - type: object
          additionalProperties: false
          required: [circle]
          properties:
            circle:
              type: object
              additionalProperties: false
              required: [x, y, radius]
              properties:
                x: {type: number}
                y: {type: number}
                radius: {type: number, exclusiveMinimum: 0}
        - type: object
          additionalProperties: false
          required: [polygon]
          properties:
            polygon: {type: array, minItems: 3, maxItems: 100, items: {$ref: '#/components/schemas/ZoneVertex'}}
    CalibrationZoneInput:
      description: One shape of a calibrated zone as drawn, in full-frame pixels; a key may have several shapes (for example one polygon per arm)
      allOf:
        - type: object
          required: [key]
          properties:
            key: {type: string, description: A calibrated zone key of the paradigm version, such as arms}
        - $ref: '#/components/schemas/ZoneShape'
    CalibrationZone:
      type: object
      required: [key, pixels, centimeters]
      description: One shape of a calibrated zone. A circle keeps its mapped centre and gets the mean distance to its mapped boundary as the radius, since a homography does not keep circles round.
      properties:
        key: {type: string}
        pixels: {$ref: '#/components/schemas/ZoneShape'}
        centimeters: {$ref: '#/components/schemas/ZoneShape'}
    Calibration:
      type: object
      required: [id, scope, testSubjectId, recordingId, trialId, videoAssetId, environmentRevisionId, supersedesId, cameraId, frameWidth, frameHeight, crop, referenceFrameUs, measurementPlane, fitPoints, checkPoints, transform, zones, fitRmsErrorCm, checkRmsErrorCm, checkMaxErrorCm, toleranceCm, algorithmVersion, status, rejectionReason, createdBy, createdAt]
      description: Immutable; an analysis job copies the calibration it uses
      properties:
        id: {type: string, format: uuid}
        scope: {type: string, enum: [ENVIRONMENT, OVERRIDE, TRIAL], description: 'ENVIRONMENT is the default of a revision, OVERRIDE a manual calibration of one animal of a test on one video, TRIAL a calibration of a paradigm trial on its own video (never the environment''s)'}
        testSubjectId: {type: [string, 'null'], format: uuid, description: Null for an environment calibration}
        recordingId: {type: [string, 'null'], format: uuid, description: The video an override was read from; null otherwise}
        trialId: {type: [string, 'null'], format: uuid, description: The paradigm trial a TRIAL calibration belongs to}
        videoAssetId: {type: [string, 'null'], format: uuid, description: The trial video a TRIAL calibration was read from}
        environmentRevisionId: {type: string, format: uuid}
        supersedesId: {type: [string, 'null'], format: uuid}
        cameraId: {type: string}
        frameWidth: {type: integer}
        frameHeight: {type: integer}
        crop: {$ref: '#/components/schemas/CalibrationCrop'}
        referenceFrameUs: {type: [integer, 'null'], format: int64, description: Null for an environment calibration}
        measurementPlane: {type: string, enum: [ARENA_FLOOR, WATER_SURFACE, APPARATUS_TOP, APPARATUS_SIDE]}
        fitPoints: {type: array, items: {$ref: '#/components/schemas/CalibrationPoint'}}
        checkPoints: {type: array, items: {$ref: '#/components/schemas/CalibrationPoint'}}
        transform: {type: array, minItems: 9, maxItems: 9, items: {type: number}, description: Row-major 3x3 homography from pixels to centimeters, normalized so the last entry is 1}
        zones: {type: array, items: {$ref: '#/components/schemas/CalibrationZone'}, description: 'Calibrated zone shapes sorted by key, shapes of one key in drawing order; empty for paradigms whose zones come from parameters'}
        fitRmsErrorCm: {type: number}
        checkRmsErrorCm: {type: number}
        checkMaxErrorCm: {type: number}
        toleranceCm: {type: number, description: The paradigm's max_calibration_error_cm}
        algorithmVersion: {type: string}
        status: {type: string, enum: [VALID, REJECTED]}
        rejectionReason: {type: [string, 'null'], enum: [EXCESSIVE_CHECK_ERROR, null]}
        createdBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
    AnalysisCapability:
      type: object
      additionalProperties: false
      required: [paradigmKey, paradigmVersion]
      properties:
        paradigmKey: {type: string, pattern: '^[A-Z][A-Z_]{0,39}$'}
        paradigmVersion: {type: integer, minimum: 1}
    AnalysisWorkerInput:
      type: object
      additionalProperties: false
      required: [name, modelVersion, capabilities]
      properties:
        name: {type: string, minLength: 1, maxLength: 120, description: Unique, case-insensitive}
        modelVersion: {type: string, minLength: 1, maxLength: 120}
        capabilities: {type: array, minItems: 1, items: {$ref: '#/components/schemas/AnalysisCapability'}, description: Paradigm versions from the catalog}
    AnalysisWorker:
      type: object
      required: [id, name, modelVersion, capabilities, disabledAt, createdAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        modelVersion: {type: string}
        capabilities: {type: array, items: {$ref: '#/components/schemas/AnalysisCapability'}}
        disabledAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
    AnalysisRun:
      type: object
      required: [id, jobId, experimentId, testId, testSubjectId, recordingId, sourceVideoId, sourceGeneration, sourceCrc32c, clipStartUs, clipEndUs, calibrationId, paradigmKey, paradigmVersion, metricEngineVersion, resultSchemaVersion, parameters, trigger, status, attempt, maxAttempts, workerId, leaseExpiresAt, modelVersion, failureReason, createdBy, createdAt, finishedAt]
      description: An analysis of one animal of a test, a job of the analysis service linked to the animal; id is the job id. The job's inputs never change; reanalysis is a new job
      properties:
        id: {type: string, format: uuid, description: The job id}
        jobId: {type: string, format: uuid}
        experimentId: {type: string, format: uuid}
        testId: {type: string, format: uuid}
        testSubjectId: {type: string, format: uuid, description: The animal of the test this run analyses}
        recordingId: {type: string, format: uuid}
        sourceVideoId: {type: string, format: uuid}
        sourceGeneration: {type: string, pattern: '^[0-9]+$', description: GCS generation of the analyzed original}
        sourceCrc32c: {type: string, description: Base64 big-endian CRC32C}
        clipStartUs: {type: integer, format: int64}
        clipEndUs: {type: [integer, 'null'], format: int64}
        calibrationId: {type: [string, 'null'], format: uuid, description: The effective calibration of the animal's arena when the run was created; set only for paradigms that require calibration}
        paradigmKey: {type: string}
        paradigmVersion: {type: integer}
        metricEngineVersion: {type: integer}
        resultSchemaVersion: {type: integer}
        parameters: {type: object, additionalProperties: {type: number}, description: The arena's parameters merged with the step's session parameters}
        trigger: {type: string, enum: [AUTOMATIC, MANUAL]}
        status: {type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED]}
        attempt: {type: integer, minimum: 0, description: Number of claims; the current attempt is the fencing token}
        maxAttempts: {type: integer}
        workerId: {type: [string, 'null'], format: uuid}
        leaseExpiresAt: {type: [string, 'null'], format: date-time}
        modelVersion: {type: [string, 'null']}
        failureReason: {type: [string, 'null'], description: 'The worker reason, or LEASE_EXPIRED'}
        createdBy: {type: [string, 'null'], format: uuid, description: Null for automatic runs}
        createdAt: {type: string, format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
    AnalysisRequester:
      type: object
      required: [kind, id]
      description: Who asked for a job, as an opaque reference the service never reads
      properties:
        kind: {type: string, enum: [TRIAL, TEST_SUBJECT]}
        id: {type: string, format: uuid}
    AnalysisCalibration:
      type: object
      required: [id, frameWidth, frameHeight, crop, measurementPlane, transform, zones]
      description: The calibration snapshot a job analyses with; id names the calibration it was copied from
      properties:
        id: {type: string, format: uuid}
        frameWidth: {type: integer}
        frameHeight: {type: integer}
        crop: {$ref: '#/components/schemas/CalibrationCrop'}
        measurementPlane: {type: string, enum: [ARENA_FLOOR, WATER_SURFACE, APPARATUS_TOP, APPARATUS_SIDE]}
        transform: {type: array, minItems: 9, maxItems: 9, items: {type: number}, description: Row-major homography from full-frame pixels (top-left corner at 0,0) to arena centimeters}
        zones: {type: array, items: {$ref: '#/components/schemas/CalibrationZone'}, description: 'The calibrated zone shapes in full-frame pixels (tracking limits, overlay) and centimetres (the engine computes zone metrics with them)'}
    AnalysisJob:
      type: object
      required: [id, requester, paradigmKey, paradigmVersion, metricEngineVersion, resultSchemaVersion, parameters, sourceVideoId, sourceGeneration, sourceCrc32c, clipStartUs, clipEndUs, calibrationId, calibration, trigger, status, attempt, maxAttempts, workerId, leaseExpiresAt, modelVersion, failureReason, createdBy, createdAt, finishedAt]
      description: A job of the analysis service, an immutable input snapshot and its execution state; reanalysis is a new job
      properties:
        id: {type: string, format: uuid}
        requester: {$ref: '#/components/schemas/AnalysisRequester'}
        paradigmKey: {type: string}
        paradigmVersion: {type: integer}
        metricEngineVersion: {type: integer}
        resultSchemaVersion: {type: integer}
        parameters: {type: object, additionalProperties: {type: number}, description: The resolved apparatus, analysis and session values}
        sourceVideoId: {type: string, format: uuid}
        sourceGeneration: {type: string, pattern: '^[0-9]+$', description: GCS generation of the analysed original}
        sourceCrc32c: {type: string, description: Base64 big-endian CRC32C}
        clipStartUs: {type: integer, format: int64}
        clipEndUs: {type: [integer, 'null'], format: int64}
        calibrationId: {type: [string, 'null'], format: uuid}
        calibration: {oneOf: [{type: 'null'}, {$ref: '#/components/schemas/AnalysisCalibration'}]}
        trigger: {type: string, enum: [AUTOMATIC, MANUAL]}
        status: {type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED]}
        attempt: {type: integer, minimum: 0, description: Number of claims; the current attempt is the fencing token}
        maxAttempts: {type: integer}
        workerId: {type: [string, 'null'], format: uuid}
        leaseExpiresAt: {type: [string, 'null'], format: date-time}
        modelVersion: {type: [string, 'null']}
        failureReason: {type: [string, 'null'], description: 'The worker reason, QC_FAILED with the rule, or LEASE_EXPIRED'}
        createdBy: {type: [string, 'null'], format: uuid}
        createdAt: {type: string, format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
    AnalysisJobDetail:
      allOf:
        - $ref: '#/components/schemas/AnalysisJob'
        - type: object
          required: [result]
          properties:
            result: {oneOf: [{$ref: '#/components/schemas/AnalysisResult'}, {type: 'null'}]}
    AnalysisQC:
      type: object
      required: [samples, tracked, inferred, lostRatio, inferredRatio, meanConfidence, passed]
      description: Tracking quality of the trajectory the job measured
      properties:
        samples: {type: integer}
        tracked: {type: integer}
        inferred: {type: integer}
        lostRatio: {type: number}
        inferredRatio: {type: number}
        meanConfidence: {type: number}
        passed: {type: boolean}
    AnalysisVideoPair:
      type: object
      required: [originalUrl, analyzedUrl, expiresAt, sourceVideoId, sourceGeneration, analyzedGeneration, sourceOffsetUs, outputOffsetUs, timeMappingVersion]
      properties:
        originalUrl: {type: string, format: uri}
        analyzedUrl: {type: string, format: uri}
        expiresAt: {type: string, format: date-time}
        sourceVideoId: {type: string, format: uuid}
        sourceGeneration: {type: string, pattern: '^[0-9]+$'}
        analyzedGeneration: {type: string, pattern: '^[0-9]+$'}
        sourceOffsetUs: {type: integer, format: int64, description: Original video time of analysed time zero (the clip start)}
        outputOffsetUs: {type: integer, format: int64, description: Analysed video time of analysed time zero}
        timeMappingVersion: {type: string}
    ReadLink:
      type: object
      required: [url, expiresAt]
      properties:
        url: {type: string, format: uri}
        expiresAt: {type: string, format: date-time}
    TrialInput:
      type: object
      additionalProperties: false
      required: [name, paradigmKey, paradigmVersion, environmentRevisionId]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        paradigmKey: {type: string}
        paradigmVersion: {type: integer, minimum: 1}
        environmentRevisionId: {type: string, format: uuid, description: An arena of the same paradigm version}
        notes: {type: string, maxLength: 2000}
    Trial:
      type: object
      required: [id, name, paradigmKey, paradigmVersion, environmentRevisionId, videoId, clipStartUs, clipEndUs, notes, createdBy, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        paradigmKey: {type: string}
        paradigmVersion: {type: integer}
        environmentRevisionId: {type: string, format: uuid}
        videoId: {type: [string, 'null'], format: uuid, description: The current video; a replacement upload takes its place}
        clipStartUs: {type: integer, format: int64}
        clipEndUs: {type: [integer, 'null'], format: int64}
        notes: {type: [string, 'null']}
        createdBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    TrialArena:
      type: object
      required: [environmentRevisionId, environmentId, environmentName, revision]
      properties:
        environmentRevisionId: {type: string, format: uuid}
        environmentId: {type: string, format: uuid}
        environmentName: {type: string}
        revision: {type: integer}
        parameters: {type: object, additionalProperties: {type: number}, description: The arena's apparatus and analysis values (trial page only)}
    TrialJob:
      type: object
      required: [id, status, paradigmKey, paradigmVersion, parameters, sourceVideoId, calibrationId, attempt, maxAttempts, modelVersion, failureReason, createdAt, finishedAt]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED]}
        paradigmKey: {type: string}
        paradigmVersion: {type: integer}
        parameters: {type: object, additionalProperties: {type: number}}
        sourceVideoId: {type: string, format: uuid}
        calibrationId: {type: [string, 'null'], format: uuid}
        attempt: {type: integer}
        maxAttempts: {type: integer}
        modelVersion: {type: [string, 'null']}
        failureReason: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
    TrialSummary:
      allOf:
        - $ref: '#/components/schemas/Trial'
        - type: object
          required: [arena, latestJob]
          properties:
            arena: {$ref: '#/components/schemas/TrialArena'}
            latestJob: {oneOf: [{type: 'null'}, {$ref: '#/components/schemas/TrialJob'}]}
    TrialVideo:
      type: object
      required: [id, fileName, contentType, sizeBytes, status, rejectionReason, createdAt, verifiedAt]
      properties:
        id: {type: string, format: uuid}
        fileName: {type: [string, 'null']}
        contentType: {type: string}
        sizeBytes: {type: integer, format: int64}
        status: {type: string, enum: [PENDING, VERIFIED, REJECTED]}
        rejectionReason: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        verifiedAt: {type: [string, 'null'], format: date-time}
    TrialAnalysis:
      type: object
      required: [jobId, trigger, videoId, calibrationId, overrides, createdBy, createdAt, job, metrics, qc]
      description: One analysis of a trial; events, the overlay video and the track are read from the job's routes
      properties:
        jobId: {type: string, format: uuid}
        trigger: {type: string, enum: [AUTOMATIC, MANUAL]}
        videoId: {type: string, format: uuid}
        calibrationId: {type: [string, 'null'], format: uuid}
        overrides: {type: object, additionalProperties: {type: number}, description: The ANALYSIS values changed for this analysis}
        createdBy: {type: [string, 'null'], format: uuid}
        createdAt: {type: string, format: date-time}
        job: {$ref: '#/components/schemas/TrialJob'}
        metrics:
          type: array
          items: {type: object, required: [key, unit, value, missingReason], properties: {key: {type: string}, unit: {type: string}, value: {type: [number, 'null']}, missingReason: {type: [string, 'null']}}}
        qc: {oneOf: [{type: 'null'}, {$ref: '#/components/schemas/AnalysisQC'}]}
    TrialDetail:
      allOf:
        - $ref: '#/components/schemas/Trial'
        - type: object
          required: [arena, video, calibrationId, analyses]
          properties:
            arena: {$ref: '#/components/schemas/TrialArena'}
            video: {oneOf: [{type: 'null'}, {$ref: '#/components/schemas/TrialVideo'}]}
            calibrationId: {type: [string, 'null'], format: uuid, description: The valid calibration the trial would be analysed with now, its own on this video else the arena default}
            analyses: {type: array, items: {$ref: '#/components/schemas/TrialAnalysis'}, description: Newest first}
    AnalysisContract:
      type: object
      required: [requiredZones, metrics, events, missingReasons, qc]
      description: What the metric engine will compute from the trajectory; workers send no metrics or events
      properties:
        requiredZones: {type: array, items: {type: string}, description: Calibrated zones the claimed calibration carries a shape for (empty for the water maze, whose zones derive from parameters)}
        qc:
          type: array
          items: {type: object, required: [key, operator, value], properties: {key: {type: string}, operator: {type: string, enum: ['>=', '<=']}, value: {type: number}}}
        metrics:
          type: array
          items:
            type: object
            required: [key, unit, integer, min, max]
            properties:
              key: {type: string}
              unit: {type: string}
              integer: {type: boolean}
              min: {type: number}
              max: {type: number}
        events:
          type: array
          items: {type: object, required: [type, kind], properties: {type: {type: string}, kind: {type: string, enum: [INTERVAL, POINT]}}}
        missingReasons: {type: array, items: {type: string, enum: [NO_VALID_INTERVALS, EVENT_NOT_OBSERVED, ZERO_DENOMINATOR, INCOMPLETE_RECORDING, BELOW_EXPLORATION_CRITERION]}}
    AnalysisAttempt:
      type: object
      additionalProperties: false
      required: [attempt]
      properties:
        attempt: {type: integer, minimum: 1}
    AnalysisOutputInput:
      type: object
      additionalProperties: false
      required: [attempt, kind, fileName, contentType, sizeBytes, crc32c]
      properties:
        attempt: {type: integer, minimum: 1}
        kind: {type: string, enum: [ANALYZED_VIDEO, TRAJECTORY, THUMBNAIL]}
        fileName: {type: string, minLength: 1, maxLength: 120, description: 'No "/", "\" or ".."; stored under the attempt prefix'}
        contentType: {type: string, enum: [video/mp4, video/webm, application/json, image/jpeg, image/png], description: ANALYZED_VIDEO takes video types, TRAJECTORY application/json (misko.trajectory.v1), THUMBNAIL images}
        sizeBytes: {type: integer, format: int64, minimum: 1}
        crc32c: {type: string, description: Base64 big-endian CRC32C}
    AnalysisResultInput:
      type: object
      additionalProperties: false
      required: [attempt, modelVersion, artifacts, pair]
      description: Metrics and events are not accepted; the API computes them from the TRAJECTORY artifact.
      properties:
        attempt: {type: integer, minimum: 1}
        modelVersion: {type: string, minLength: 1, maxLength: 120}
        recordingDurationUs: {type: integer, format: int64, description: Required when the clip has no end; must equal the clip length otherwise and the trajectory's durationUs}
        artifacts:
          type: array
          description: Declared outputs of this attempt, exactly one ANALYZED_VIDEO and exactly one TRAJECTORY
          items:
            type: object
            additionalProperties: false
            required: [kind, objectName]
            properties:
              kind: {type: string, enum: [ANALYZED_VIDEO, TRAJECTORY, THUMBNAIL]}
              objectName: {type: string}
        pair:
          type: object
          additionalProperties: false
          required: [analyzedObjectName, sourceOffsetUs, outputOffsetUs, timeMappingVersion]
          properties:
            analyzedObjectName: {type: string}
            sourceOffsetUs: {type: integer, format: int64, description: Must equal the clip start}
            outputOffsetUs: {type: integer, format: int64, minimum: 0}
            timeMappingVersion: {type: string, minLength: 1, maxLength: 60}
    AnalysisResult:
      type: object
      required: [metrics, events, artifacts, pair, qc]
      properties:
        metrics:
          type: array
          items:
            type: object
            required: [key, unit, value, missingReason]
            properties:
              key: {type: string}
              unit: {type: string}
              value: {type: [number, 'null']}
              missingReason: {type: [string, 'null']}
        events:
          type: array
          items:
            type: object
            required: [type, label, kind, startUs, endUs, confidence]
            properties:
              type: {type: string}
              label: {type: [string, 'null'], description: 'One of the event type''s labels (the novel or the familiar object for exploration); null for types without labels'}
              kind: {type: string, enum: [INTERVAL, POINT]}
              startUs: {type: integer, format: int64}
              endUs: {type: integer, format: int64}
              confidence: {type: number}
        artifacts:
          type: array
          items:
            type: object
            required: [kind, objectName, generation, sizeBytes, contentType]
            properties:
              kind: {type: string, enum: [ANALYZED_VIDEO, TRAJECTORY, THUMBNAIL]}
              objectName: {type: string}
              generation: {type: string, pattern: '^[0-9]+$'}
              sizeBytes: {type: integer, format: int64}
              contentType: {type: string}
        pair:
          type: [object, 'null']
          required: [analyzedObjectName, sourceOffsetUs, outputOffsetUs, timeMappingVersion]
          properties:
            analyzedObjectName: {type: string}
            sourceOffsetUs: {type: integer, format: int64}
            outputOffsetUs: {type: integer, format: int64}
            timeMappingVersion: {type: string}
        qc:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/AnalysisQC'
    RejectionReason: {type: string, enum: [TRACKING_LOST, WRONG_ANIMAL, VIDEO_DEFECT, PROTOCOL_DEVIATION, OTHER]}
    AnalysisReviewItem:
      type: object
      required: [testSubjectId, status, reason, note, reviewedBy, reviewedAt, createdAt, updatedAt, testId, experimentId, experimentCode, experimentStatus, blinded, subjectCode, excluded, arena, timepointId, timepointName, paradigmKey, paradigmVersion, scheduledAt, run, latestRunId, newerRunAvailable, group]
      description: One animal's result as the review screen shows it
      properties:
        testSubjectId: {type: string, format: uuid}
        status: {type: string, enum: [PENDING, ACCEPTED, REJECTED]}
        reason: {oneOf: [{$ref: '#/components/schemas/RejectionReason'}, {type: 'null'}]}
        note: {type: [string, 'null']}
        reviewedBy: {type: [string, 'null'], format: uuid}
        reviewedAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        testId: {type: string, format: uuid}
        experimentId: {type: string, format: uuid}
        experimentCode: {type: string}
        experimentStatus: {type: string, enum: [DRAFT, RUNNING, COMPLETED]}
        blinded: {type: boolean}
        subjectCode: {type: string}
        excluded: {type: boolean}
        arena:
          type: object
          required: [environmentId, environmentName, environmentRevisionId, revision]
          properties:
            environmentId: {type: string, format: uuid}
            environmentName: {type: string}
            environmentRevisionId: {type: string, format: uuid}
            revision: {type: integer}
        timepointId: {type: string, format: uuid}
        timepointName: {type: string}
        paradigmKey: {type: string}
        paradigmVersion: {type: integer}
        scheduledAt: {type: string, format: date-time}
        run:
          type: object
          required: [id, trigger, modelVersion, metricEngineVersion, calibrationId, recordingId, finishedAt, metrics]
          description: The run under review; its analysed video is at /api/analysis-runs/{id}/video-pair
          properties:
            id: {type: string, format: uuid}
            trigger: {type: string, enum: [AUTOMATIC, MANUAL]}
            modelVersion: {type: [string, 'null']}
            metricEngineVersion: {type: integer}
            calibrationId: {type: [string, 'null'], format: uuid}
            recordingId: {type: string, format: uuid}
            finishedAt: {type: [string, 'null'], format: date-time}
            metrics:
              type: array
              items:
                type: object
                required: [key, unit, value, missingReason]
                properties:
                  key: {type: string}
                  unit: {type: string}
                  value: {type: [number, 'null']}
                  missingReason: {type: [string, 'null']}
        latestRunId: {type: string, format: uuid, description: The newest succeeded run of the animal}
        newerRunAvailable: {type: boolean}
        group:
          description: Null in a blinded experiment
          oneOf:
            - type: 'null'
            - type: object
              required: [id, code, name, role, diseaseModelName, substanceName, doseMicro, unit]
              properties:
                id: {type: string, format: uuid}
                code: {type: string}
                name: {type: string}
                role: {type: string, enum: [HEALTHY_CONTROL, SHAM, DISEASE_CONTROL, POSITIVE_CONTROL, TREATMENT]}
                diseaseModelName: {type: [string, 'null']}
                substanceName: {type: [string, 'null']}
                doseMicro: {type: [integer, 'null'], format: int64, description: Treatment dose in millionths of unit}
                unit: {type: [string, 'null']}
    Descriptives:
      type: object
      required: [n, mean, sd, sem, min, max]
      properties:
        n: {type: integer, description: Animals with an accepted value}
        mean: {type: [number, 'null']}
        sd: {type: [number, 'null'], description: Sample standard deviation of per-animal values; null below two animals}
        sem: {type: [number, 'null']}
        min: {type: [number, 'null']}
        max: {type: [number, 'null']}
    GroupStats:
      allOf:
        - $ref: '#/components/schemas/Descriptives'
        - type: object
          required: [groupId, tested, pending, awaitingAnalysis, rejected, missing, excluded, change]
          properties:
            groupId: {type: string, format: uuid}
            tested: {type: integer, description: Animals filmed at this timepoint}
            pending: {type: integer, description: Results of animals that are not excluded still waiting for review}
            awaitingAnalysis: {type: integer, description: Animals that are not excluded without a succeeded run}
            rejected: {type: integer}
            missing: {type: integer, description: Accepted results without a value for the metric}
            excluded: {type: integer, description: Excluded animals of the group}
            change:
              description: Change from the endpoint's baseline timepoint per animal; null without a baseline
              oneOf: [{type: 'null'}, {$ref: '#/components/schemas/Descriptives'}]
    StudyReport:
      type: object
      required: [experiment, groups, timepoints, sections]
      properties:
        experiment:
          type: object
          required: [id, code, title, status, blinded]
          properties:
            id: {type: string, format: uuid}
            code: {type: string}
            title: {type: string}
            status: {type: string, enum: [DRAFT, RUNNING, COMPLETED]}
            blinded: {type: boolean}
        groups:
          type: array
          items:
            type: object
            required: [id, code, name, role, diseaseModelId, diseaseModelName, treatment, allocated, excluded]
            properties:
              id: {type: string, format: uuid}
              code: {type: string}
              name: {type: string}
              role: {type: string, enum: [HEALTHY_CONTROL, SHAM, DISEASE_CONTROL, POSITIVE_CONTROL, TREATMENT]}
              diseaseModelId: {type: [string, 'null'], format: uuid}
              diseaseModelName: {type: [string, 'null']}
              treatment:
                oneOf:
                  - type: 'null'
                  - type: object
                    required: [substanceId, substanceName, doseMicro, unit]
                    properties:
                      substanceId: {type: string, format: uuid}
                      substanceName: {type: string}
                      doseMicro: {type: integer, format: int64}
                      unit: {type: string}
              allocated: {type: integer}
              excluded: {type: integer}
        timepoints:
          type: array
          items:
            type: object
            required: [id, name, studyDay, position]
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
              studyDay: {type: integer}
              position: {type: integer}
        sections:
          type: array
          description: One per endpoint, the primary endpoint first
          items:
            type: object
            required: [endpoint, versions, comparable, groups, comparisons, doseResponse, timeCourse]
            properties:
              endpoint:
                type: object
                required: [id, kind, paradigmKey, metricKey, direction, timepointId, baselineTimepointId]
                properties:
                  id: {type: string, format: uuid}
                  kind: {type: string, enum: [PRIMARY, SECONDARY]}
                  paradigmKey: {type: string}
                  metricKey: {type: string}
                  direction: {type: string, enum: [HIGHER_IS_BETTER, LOWER_IS_BETTER]}
                  timepointId: {type: string, format: uuid}
                  baselineTimepointId: {type: [string, 'null'], format: uuid}
              versions:
                type: array
                items:
                  type: object
                  required: [paradigmVersion, metricEngineVersion, unit]
                  properties:
                    paradigmVersion: {type: integer}
                    metricEngineVersion: {type: integer}
                    unit: {type: string}
              comparable: {type: boolean, description: False when accepted values come from more than one version or unit}
              groups: {type: array, description: Every group at the endpoint's timepoint, items: {$ref: '#/components/schemas/GroupStats'}}
              comparisons:
                type: array
                items:
                  type: object
                  required: [kind, groupId, referenceGroupId, healthyReferenceGroupId, difference, percentDifference, effect, rescuePercent]
                  properties:
                    kind: {type: string, enum: [MODEL_VALIDITY, ASSAY_SENSITIVITY, EFFICACY]}
                    groupId: {type: string, format: uuid}
                    referenceGroupId: {type: string, format: uuid}
                    healthyReferenceGroupId: {type: [string, 'null'], format: uuid, description: Healthy control, else a sham of the same disease model}
                    difference: {type: [number, 'null'], description: Group mean minus reference mean}
                    percentDifference: {type: [number, 'null']}
                    effect: {type: [number, 'null'], description: The difference signed so that positive is better in the endpoint's direction}
                    rescuePercent: {type: [number, 'null'], description: '(group - disease control) / (healthy reference - disease control) x 100'}
              doseResponse:
                type: array
                items:
                  type: object
                  required: [substanceId, substanceName, unit, points]
                  properties:
                    substanceId: {type: string, format: uuid}
                    substanceName: {type: string}
                    unit: {type: string}
                    points:
                      type: array
                      items:
                        type: object
                        required: [groupId, doseMicro, n, mean, rescuePercent]
                        properties:
                          groupId: {type: string, format: uuid}
                          doseMicro: {type: integer, format: int64}
                          n: {type: integer}
                          mean: {type: [number, 'null']}
                          rescuePercent: {type: [number, 'null']}
              timeCourse:
                type: array
                description: Group statistics at every timepoint with measurements, in timepoint order
                items:
                  type: object
                  required: [timepointId, groups]
                  properties:
                    timepointId: {type: string, format: uuid}
                    groups: {type: array, items: {$ref: '#/components/schemas/GroupStats'}}
    DashboardSummary:
      type: object
      required: [experiments, tests, analysisQueued, analysisRunning, analysisFailed, results, calibrationWaiting, recentActivity, upcomingTests]
      properties:
        experiments:
          type: object
          required: [draft, running, completed]
          properties:
            draft: {type: integer}
            running: {type: integer}
            completed: {type: integer}
        tests:
          type: object
          required: [planned, inProgress, completed, cancelled]
          properties:
            planned: {type: integer}
            inProgress: {type: integer}
            completed: {type: integer}
            cancelled: {type: integer}
        analysisQueued: {type: integer}
        analysisRunning: {type: integer}
        analysisFailed: {type: integer}
        results:
          type: object
          description: Animals' analysis results by review status
          required: [pending, accepted, rejected]
          properties:
            pending: {type: integer}
            accepted: {type: integer}
            rejected: {type: integer}
        calibrationWaiting: {type: integer, description: Animals of tests that are not cancelled, not excluded, filmed in a verified current video, whose paradigm requires a calibration and whose arena has no valid one (its own override for the video, else the arena default)}
        recentActivity:
          type: array
          description: The 5 most recently published analysis results, newest first
          items:
            type: object
            required: [testId, testSubjectId, subjectCode, experimentCode, paradigmKey, paradigmVersion, finishedAt]
            properties:
              testId: {type: string, format: uuid}
              testSubjectId: {type: string, format: uuid}
              subjectCode: {type: string}
              experimentCode: {type: string}
              paradigmKey: {$ref: '#/components/schemas/ConstantKey'}
              paradigmVersion: {type: integer}
              finishedAt: {type: string, format: date-time}
        upcomingTests:
          type: array
          description: The 5 soonest planned sessions
          items:
            type: object
            required: [id, subjectCodes, experimentCode, timepointName, paradigmKey, paradigmVersion, scheduledAt]
            properties:
              id: {type: string, format: uuid}
              subjectCodes: {type: array, items: {type: string}, description: Animals of the session by code}
              experimentCode: {type: string}
              timepointName: {type: string}
              paradigmKey: {$ref: '#/components/schemas/ConstantKey'}
              paradigmVersion: {type: integer}
              scheduledAt: {type: string, format: date-time}
    Probe:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    Problem:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error: {type: string}
        code: {type: string}
    Role:
      type: string
      enum: [SUPERADMIN, LAB_MANAGER, RESEARCHER, TECHNICIAN, VIEWER]
    Permission:
      type: string
      enum: ['user:manage', 'lab:configure', 'study:write', 'subject:write', 'weight:write', 'apparatus:write', 'test:write', 'test:run', '*:read']
    NewPassword:
      type: string
      description: At least 8 characters and at most 72 UTF-8 bytes; compared byte for byte
    User:
      type: object
      additionalProperties: false
      required: [id, email, name, role, createdAt]
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        name: {type: string}
        role:
          $ref: '#/components/schemas/Role'
        createdAt: {type: string, format: date-time}
