          application/json:
            schema: {$ref: '#/components/schemas/TimepointInput'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Timepoint'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/experiments/{id}/timepoints/{timepointId}:
    parameters:
      - $ref: '#/components/parameters/ID'
      - {name: timepointId, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: updateTimepoint
      summary: Update a timepoint of a draft (study:write)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TimepointPatch'}
      responses:
        '200':
          description: Updated timepoint
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Timepoint'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteTimepoint
      summary: Delete a timepoint of a draft (study:write); 409 timepoint.inUse while an endpoint uses it
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/experiments/{id}/endpoints:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: listEndpoints
      summary: Endpoints, primary first (*:read)
      responses:
        '200':
          description: Endpoints
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Endpoint'}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createEndpoint
      summary: Add an endpoint to a draft (study:write)
      description: >-
        The metric must be computed by a paradigm version that a protocol step
        of this experiment runs (400 endpoint.metricUnavailable); see
        metric-options. At most one PRIMARY endpoint (409 endpoint.primaryTaken).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EndpointInput'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Endpoint'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/experiments/{id}/endpoints/{endpointId}:
    parameters:
      - $ref: '#/components/parameters/ID'
      - {name: endpointId, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: updateEndpoint
      summary: Update an endpoint of a draft (study:write)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EndpointPatch'}
      responses:
        '200':
          description: Updated endpoint
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Endpoint'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteEndpoint
      summary: Delete an endpoint of a draft (study:write)
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/experiments/{id}/allocations:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: listAllocations
      summary: Allocated animals with every group's fill against its target (*:read)
      parameters:
        - {name: groupId, in: query, schema: {type: string, format: uuid}}
        - {name: excluded, in: query, schema: {type: boolean}}
      responses:
        '200':
          description: Allocations ordered by group code and animal code
          content:
            application/json:
              schema:
                type: object
                required: [data, groups]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Allocation'}}
                  groups: {type: array, items: {$ref: '#/components/schemas/GroupFill'}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      operationId: allocateSubject
      summary: Allocate an animal to a group of a draft or running experiment (study:write)
      description: An animal belongs to one group, ever (409 allocation.subjectAllocated).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AllocationInput'}
      responses:
        '201':
          description: Allocated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Allocation'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/experiments/{id}/allocations/randomise:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: randomiseAllocations
      summary: Distribute animals at random over groups up to their target size (study:write)
      description: >-
        Animals are taken in a random order and each goes to a group with the
        most free places below its target, ties broken at random, so groups
        fill evenly. Groups without a target take no animals. Either every
        animal is allocated or none (409 allocation.notEnoughPlaces).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subjectIds]
              properties:
                subjectIds: {type: array, minItems: 1, maxItems: 1000, uniqueItems: true, items: {type: string, format: uuid}}
                groupIds: {type: array, uniqueItems: true, items: {type: string, format: uuid}, description: Limits randomisation to these groups; default every group}
                cage: {type: string, minLength: 1, maxLength: 32}
      responses:
        '201':
          description: The new allocations
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Allocation'}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/experiments/{id}/allocations/{allocationId}:
    parameters:
      - $ref: '#/components/parameters/ID'
      - {name: allocationId, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: updateAllocation
      summary: Move an animal to another group (draft only) or set its cage (study:write)
      description: Once the experiment runs the group is fixed (409 allocation.frozen); the cage changes until it completes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                groupId: {type: string, format: uuid}
                cage: {type: string, maxLength: 32, description: An empty cage clears it}
      responses:
        '200':
          description: Updated allocation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Allocation'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: removeAllocation
      summary: Take an animal out of a draft (study:write); a running study excludes instead (409 allocation.frozen)
      responses:
        '204': {description: Removed}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/experiments/{id}/allocations/{allocationId}/exclusion:
    parameters:
      - $ref: '#/components/parameters/ID'
      - {name: allocationId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: excludeAllocation
      summary: Exclude an animal with a reason, once (study:write)
      description: The animal stays allocated and is reported as excluded; 409 allocation.alreadyExcluded on a second exclusion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {$ref: '#/components/schemas/ExclusionReason'}
                note: {type: string, maxLength: 2000}
                excludedAt: {type: string, format: date-time, description: Defaults to now; not before the allocation and not in the future}
      responses:
        '200':
          description: Excluded allocation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Allocation'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/experiments/{id}/allocations/{allocationId}/administrations:
    parameters:
      - $ref: '#/components/parameters/ID'
      - {name: allocationId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: recordAdministration
      summary: Record a dose given to an allocated animal of a running experiment (test:run)
      description: >
        A planned dose names its regimen item, which must belong to the animal's group; its purpose, substance, dose and route
        are taken from the item unless a different actual amount and unit or route is given. An unplanned dose names purpose,
        substance, amount, unit and route. A per-kilogram dose uses the animal's latest weight measured by administeredAt
        unless weightMeasurementId names one; the weight must be at most 7 days older than the dose. The response carries the
        computed absolute amount. A NONE regimen item (a period without any substance) is never administered: 400
        administration.noSubstanceItem.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AdministrationInput'}}}}
      responses:
        '201': {description: Recorded, content: {application/json: {schema: {$ref: '#/components/schemas/Administration'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/experiments/{id}/administrations:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: listExperimentAdministrations
      summary: Doses given in an experiment, newest first (*:read)
      parameters:
        - {name: allocationId, in: query, schema: {type: string, format: uuid}, description: Only this animal's doses}
        - $ref: '#/components/parameters/SubstanceFilter'
        - {name: purpose, in: query, schema: {$ref: '#/components/schemas/DosePurpose'}}
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': {description: One page of administrations, content: {application/json: {schema: {$ref: '#/components/schemas/AdministrationPage'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /api/subjects/{id}/administrations:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: listSubjectAdministrations
      summary: Doses given to one animal, newest first (*:read)
      parameters:
        - $ref: '#/components/parameters/SubstanceFilter'
        - {name: purpose, in: query, schema: {$ref: '#/components/schemas/DosePurpose'}}
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': {description: One page of administrations, content: {application/json: {schema: {$ref: '#/components/schemas/AdministrationPage'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /api/experiments/{id}/dosing:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: listDueDoses
      summary: Every dose due on one day from the regimen items and day 0, per animal, with how many were given (*:read)
      description: >
        The day runs from midnight to midnight in the laboratory's time zone. Animals allocated after that day or excluded
        before it are left out; animals with nothing due are left out. Only doses recorded against the regimen item count as
        given. 409 experiment.notStarted while the experiment is a draft.
      parameters:
        - {name: date, in: query, schema: {type: string, format: date}, description: Defaults to the laboratory's current date}
      responses:
        '200': {description: Due doses, content: {application/json: {schema: {$ref: '#/components/schemas/DosingSchedule'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/experiments/{id}/allocations/{allocationId}/induction-outcome:
    parameters:
      - $ref: '#/components/parameters/ID'
      - {name: allocationId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: recordInductionOutcome
      summary: Record whether an animal's disease model was confirmed (test:run); once per animal, never changed
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InductionOutcomeInput'}}}}
      responses:
        '201': {description: Recorded, content: {application/json: {schema: {$ref: '#/components/schemas/InductionOutcome'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/experiments/{id}/induction-outcomes:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: listInductionOutcomes
      summary: Induction outcomes of an experiment by group and animal code (*:read)
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/InductionOutcomeStatus'}}
      responses:
        '200':
          description: Outcomes
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/InductionOutcomeRow'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /api/paradigms:
    get:
      operationId: listParadigms
      summary: Paradigms with their published versions (*:read); the catalog is read-only
      parameters:
        - {name: lang, in: query, schema: {type: string, enum: [en, tr]}, description: Language of names, labels and explanations; otherwise Accept-Language, otherwise en. The response carries Content-Language}
      responses:
        '200':
          description: Paradigms ordered by key
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/ParadigmSummary'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /api/paradigms/{key}:
    parameters:
      - $ref: '#/components/parameters/ParadigmKey'
    get:
      operationId: getLatestParadigm
      summary: Manifest of the latest published version (*:read)
      parameters:
        - {name: lang, in: query, schema: {type: string, enum: [en, tr]}, description: Language of names, labels and explanations; otherwise Accept-Language, otherwise en. The response carries Content-Language}
      responses:
        '200': {description: Manifest, content: {application/json: {schema: {$ref: '#/components/schemas/ParadigmManifest'}}}}
