name: misko

# Pull-based deployment: uses prebuilt images from GHCR instead of building from
# source. Intended for machines without the source checkout (e.g. a reviewer).
#
#   1. Put this file and `.env.prod.example` (copied to `.env`) in a folder.
#   2. docker compose -f docker-compose.prod.yml pull
#   3. docker compose -f docker-compose.prod.yml --profile setup run --rm schema
#   4. docker compose -f docker-compose.prod.yml --profile setup run --rm setup
#      (prints the one-time administrator password to your terminal)
#   5. docker compose -f docker-compose.prod.yml up -d
#
# Steps 3 and 4 are one-time. The API does not install the schema or create the
# administrator on its own, so starting the stack without them leaves an empty
# database and no way to sign in.
#
# Override IMAGE_OWNER / IMAGE_TAG in `.env` if the images live elsewhere.

x-database-url: &database-url postgres://${POSTGRES_USER:-misko}:${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-misko}?sslmode=disable

services:
  db:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-misko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-misko}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-misko} -d ${POSTGRES_DB:-misko}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-time: installs the schema into an empty database.
  schema:
    image: ghcr.io/${IMAGE_OWNER:-happyhackingspace}/misko-backend:${IMAGE_TAG:-latest}
    entrypoint: ["/bootstrap", "schema"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    profiles: [setup]

  # One-time: creates the laboratory and the first administrator. Run it with
  # `run --rm` so the generated password reaches your terminal; it is shown once
  # and never written to a log.
  setup:
    image: ghcr.io/${IMAGE_OWNER:-happyhackingspace}/misko-backend:${IMAGE_TAG:-latest}
    entrypoint: ["/bootstrap", "setup"]
    environment:
      DATABASE_URL: *database-url
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@misko.local}
      LAB_NAME: ${LAB_NAME:-Misko Laboratory}
      LAB_TIMEZONE: ${LAB_TIMEZONE:-UTC}
    depends_on:
      db:
        condition: service_healthy
    profiles: [setup]

  backend:
    image: ghcr.io/${IMAGE_OWNER:-happyhackingspace}/misko-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      HTTP_ADDR: :4000
      JWT_SECRET: ${JWT_SECRET:?set a strong JWT_SECRET in .env}
      TOKEN_TTL: ${TOKEN_TTL:-12h}
    # GCS_BUCKET/GCS_SIGNER_EMAIL live in storage.env, not here: like the
    # worker's token, they're safe to overwrite on every deploy (unlike the
    # database password and JWT secret), so the workflow renders them fresh
    # each run instead of leaving them alone like it does `.env`. Video routes
    # answer 503 until this file names a real bucket.
    env_file:
      - path: storage.env
        required: false
    depends_on:
      db:
        condition: service_healthy

  # Queues analysis runs for verified, calibrated recordings and requeues
  # expired leases. It needs the database only; workers call the API.
  jobs:
    image: ghcr.io/${IMAGE_OWNER:-happyhackingspace}/misko-backend:${IMAGE_TAG:-latest}
    entrypoint: ["/jobs"]
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      JOB_INTERVAL: ${JOB_INTERVAL:-10s}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/${IMAGE_OWNER:-happyhackingspace}/misko-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

  # Open Field analysis worker. No published GHCR image exists yet (`release.yml`
  # only builds backend/frontend), so this builds from the local `worker/`
  # source instead of pulling - the deploy workflow copies that folder next to
  # this file. Swap to a `ghcr.io/.../misko-worker:${IMAGE_TAG:-latest}` image
  # once one is published. Register a worker first
  # (`POST /api/analysis/workers`, needs `lab:configure`) to get its token.
  # The token lives in `worker.env`, not `.env`: unlike the database password
  # and JWT secret, it is safe to overwrite on every deploy, so the workflow
  # renders it fresh each run instead of leaving it alone like it does `.env`.
  # Until a real token is set the container exits repeatedly (harmless,
  # bounded by the limits below). Tested only on synthetic video so far (see
  # worker/README.md) - do not trust its results yet.
  worker:
    build: ./worker
    profiles: [worker]
    restart: unless-stopped
    # A 2880x1620 clip peaks near 2 GB while the background model is built
    # (frame list, its np.stack copy and the percentile partition), so 1g gets
    # the worker killed. The VM has 4 GB; the rest of the stack needs about 1.
    mem_limit: 2560m
    cpus: 1.0
    environment:
      MISKO_API_URL: http://backend:4000
    env_file:
      - path: worker.env
        required: false
    depends_on:
      - backend

volumes:
  db-data:
